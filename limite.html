<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B4BDB">
<title>Límites · Aprende jugando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1FA; --card:#FFFFFF; --ink:#1B1F3B; --muted:#5A6185; --line:#E2E6F2;
  --pri:#5B4BDB; --pri-d:#4232BE; --pri-l:#ECE9FF;
  --ok:#15A34A; --ok-d:#0E7A36; --ok-l:#DDFBE7;
  --bad:#DC2626; --bad-d:#A51C1C; --bad-l:#FEE4E4;
  --warn:#F59E0B; --warn-l:#FFF4D6;
  --c1:#6D5DF5; --c2:#0EA5E9; --c3:#F97316; --c4:#10B981;
  --tc:var(--pri);
  --r:22px; --sh:0 8px 24px rgba(35,40,90,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 10% 0%,#E2DDFF 0,transparent 40%),radial-gradient(circle at 100% 30%,#D8F1FF 0,transparent 35%),var(--bg)}
button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:.4em 0}
b,strong{font-weight:900}
.muted{color:var(--muted)}

/* ---------- Barra superior ---------- */
#topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);box-shadow:0 2px 16px rgba(30,34,64,.08);padding:10px 16px;display:none}
#topbar.show{display:block;animation:drop .4s ease}
@keyframes drop{from{transform:translateY(-100%)}to{transform:none}}
.tb-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.home{width:50px;height:50px;border-radius:16px;border:none;background:var(--pri-l);font-size:24px;flex:none;transition:transform .15s}
.home:active{transform:scale(.92)}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:900;display:grid;place-items:center;font-size:19px;flex:none}
.who-txt{min-width:0}
.who-txt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-txt span{font-size:14px;color:var(--muted);font-weight:800}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:900;font-size:17px;background:#F1F3FA;white-space:nowrap}
.chip.ok{background:var(--ok-l);color:var(--ok)}
.chip.bad{background:var(--bad-l);color:var(--bad)}
.chip.bump{animation:bump .55s}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.3)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@media(max-width:560px){.tb-in{flex-wrap:wrap;gap:8px}.chips{width:100%}.chip{flex:1;font-size:16px;padding:7px 8px}.home{width:46px;height:46px}}

main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.screen{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- Componentes ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.btn{border:none;border-radius:18px;padding:14px 22px;font-size:19px;font-weight:900;color:#fff;background:var(--pri);box-shadow:0 5px 0 var(--pri-d);transition:transform .1s,box-shadow .1s,filter .2s;min-height:58px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pri-d)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.btn.ok:active{box-shadow:0 1px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-d)}
.btn.bad:active{box-shadow:0 1px 0 var(--bad-d)}
.btn.tc{background:var(--tc);box-shadow:0 5px 0 rgba(0,0,0,.22)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #D3D9EA;border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 #D3D9EA}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
:focus-visible{outline:4px solid #FFB020;outline-offset:3px}
.sec{font-size:24px;margin:30px 4px 6px;display:flex;align-items:center;gap:8px}
.grid3{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.grid3{grid-template-columns:repeat(3,1fr)}}

/* ---------- Bienvenida ---------- */
.welcome{display:grid;gap:22px;align-items:center;min-height:calc(100vh - 80px);grid-template-columns:1fr}
@media(min-width:900px){.welcome{grid-template-columns:1.1fr 1fr}}
.hero{text-align:center}
.hero .logo{display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 18px;font-weight:900;color:var(--pri);box-shadow:var(--sh);font-size:16px}
.hero h1{font-size:clamp(38px,8vw,60px);margin:14px 0 6px;letter-spacing:-1px}
.hero h1 span{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:19px;color:var(--muted);max-width:460px;margin:0 auto}
.hero-art{max-width:420px;margin:18px auto 0}
.form .field-w{margin-bottom:18px}
.form label{display:block;font-weight:900;margin-bottom:8px;font-size:18px}
.txt{width:100%;font:inherit;font-size:20px;font-weight:800;padding:16px 18px;border-radius:16px;border:3px solid var(--line);background:#F8F9FD;color:var(--ink);transition:border-color .2s,background .2s}
.txt:focus{border-color:var(--pri);background:#fff;outline:none}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade{border:3px solid var(--line);background:#F8F9FD;border-radius:16px;padding:14px 4px;font-size:20px;font-weight:900;transition:all .15s}
.grade.sel{border-color:var(--pri);background:var(--pri-l);color:var(--pri);transform:scale(1.04)}
.err-msg{color:var(--bad);font-weight:800;font-size:16px;min-height:22px}

/* ---------- Menú ---------- */
.hello{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(135deg,#6D5DF5,#4F8BF5);color:#fff;overflow:hidden;position:relative}
.hello h1{font-size:clamp(26px,5vw,36px)}
.hello p{opacity:.92;font-weight:700}
.hello .big{font-size:62px;line-height:1;opacity:.95;flex:none;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(min-width:760px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh);text-align:center}
.stat .v{font-size:26px;font-weight:900}
.stat .k{font-size:14px;color:var(--muted);font-weight:800}
.lcard{position:relative;border:none;text-align:left;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .2s,box-shadow .2s;border-top:7px solid var(--tc)}
.lcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(35,40,90,.13)}
.lcard:active{transform:scale(.98)}
.lcard .ico{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;background:color-mix(in srgb,var(--tc) 14%,#fff)}
.lcard .num{font-size:14px;font-weight:900;color:var(--tc);text-transform:uppercase;letter-spacing:.06em}
.lcard h3{font-size:22px}
.lcard p{color:var(--muted);font-weight:700;font-size:16px;margin:0}
.lsteps{display:flex;flex-wrap:wrap;gap:6px}
.lsteps span{font-size:13px;font-weight:800;background:#F2F4FA;border-radius:999px;padding:4px 10px}
.lgo{margin-top:auto;font-weight:900;color:var(--tc);font-size:17px}
.badge-done{position:absolute;top:14px;right:14px;background:var(--ok-l);color:var(--ok);font-weight:900;font-size:13px;padding:5px 10px;border-radius:999px}
.ecard{border-top:none;background:linear-gradient(150deg,var(--tc),color-mix(in srgb,var(--tc) 70%,#1B1F3B));color:#fff}
.ecard p,.ecard .num,.ecard .lgo{color:#fff;opacity:.95}
.ecard .ico{background:rgba(255,255,255,.2)}

/* ---------- Lección ---------- */
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.back{width:50px;height:50px;border-radius:16px;border:none;background:#fff;box-shadow:var(--sh);font-size:22px;font-weight:900;flex:none}
.lhead small{font-weight:900;color:var(--tc);text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.lhead h1{font-size:clamp(22px,4.5vw,30px)}
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;padding:6px;border-radius:20px;box-shadow:var(--sh);margin-bottom:18px}
.stp{border:none;background:transparent;border-radius:15px;padding:12px 6px;font-weight:900;font-size:16px;color:var(--muted);transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px}
.stp .n{width:26px;height:26px;border-radius:50%;background:#EEF0F7;display:grid;place-items:center;font-size:14px}
.stp.on{background:var(--tc);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--tc) 40%,transparent)}
.stp.on .n{background:rgba(255,255,255,.25)}
@media(max-width:420px){.stp{flex-direction:column;gap:2px;font-size:14px}}

.split{display:grid;gap:20px;grid-template-columns:1fr;align-items:start}
@media(min-width:860px){.split{grid-template-columns:1fr 1fr}}
.slide h2{font-size:clamp(23px,4.5vw,30px);margin-bottom:10px;display:flex;gap:10px;align-items:center}
.slide h2 .pill{font-size:14px;background:color-mix(in srgb,var(--tc) 15%,#fff);color:var(--tc);padding:4px 10px;border-radius:999px}
.pager{display:flex;gap:6px;justify-content:center;margin:16px 0 4px}
.pager i{width:10px;height:10px;border-radius:99px;background:#D7DCEB;transition:all .3s}
.pager i.on{width:28px;background:var(--tc)}
.navrow{display:flex;gap:12px;margin-top:16px}
.navrow .btn{flex:1}
.big-q{background:color-mix(in srgb,var(--tc) 9%,#fff);border-left:6px solid var(--tc);padding:14px 16px;border-radius:14px;font-size:20px;margin:12px 0}
.notation{font-size:28px;font-weight:900;text-align:center;padding:16px;background:#F7F8FD;border-radius:18px;margin:12px 0;border:2px dashed #D6DBEB}
.tip{background:var(--warn-l);border-radius:14px;padding:12px 14px;font-weight:700;margin:12px 0}
.keybox{background:var(--ok-l);border-radius:14px;padding:12px 14px;font-weight:700;margin:12px 0}
.alert{background:var(--bad-l);border-radius:14px;padding:12px 14px;font-weight:700;margin:12px 0}
ul.clean{padding-left:0;list-style:none;margin:10px 0}
ul.clean li{padding:8px 0 8px 36px;position:relative;font-weight:700}
ul.clean li::before{content:attr(data-i);position:absolute;left:0;top:6px;font-size:22px}

/* Notación matemática */
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin-right:4px}
.lim>span{font-weight:900}
.lim small{font-size:.55em;font-weight:900;margin-top:3px;white-space:nowrap}
.lim sup{font-size:.85em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}
.frac>span:first-child{border-bottom:2.5px solid currentColor;padding:0 6px 2px}
.frac>span:last-child{padding:2px 6px 0}
.sqrt{white-space:nowrap}
.sqrt>span{border-top:2.5px solid currentColor;padding:0 4px;margin-left:1px}
.math{font-size:clamp(24px,5vw,32px);font-weight:900;text-align:center;padding:18px 10px;background:#F7F8FD;border-radius:18px;margin:10px 0;overflow-x:auto}
.pw{display:inline-flex;align-items:center;gap:6px;font-size:.9em}
.pw-brace{font-size:2.6em;font-weight:400;line-height:1}
.pw-rows{display:flex;flex-direction:column;gap:6px;text-align:left}
.pw-row{display:flex;gap:14px;align-items:baseline;white-space:nowrap}
.pw-row span{font-size:.75em;color:var(--muted)}

/* Gráficas */
.graph{width:100%;max-width:440px;display:block;margin:0 auto;height:auto}
.g-bg{fill:#FBFCFF;stroke:#E2E6F2}
.g-grid{stroke:#ECEFF7;stroke-width:1}
.g-axis{stroke:#8A91B2;stroke-width:1.6}
.g-num{font-size:11px;fill:#7A80A0;font-weight:800;font-family:Nunito,sans-serif}
.g-mark{stroke:var(--tc);stroke-width:2;stroke-dasharray:5 5;opacity:.75}
.g-curve{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.g-guide{stroke:#1B1F3B;stroke-width:1.6;stroke-dasharray:4 4;opacity:.55}
.g-pulse{fill:none;stroke:#F59E0B;stroke-width:3;animation:gpulse 1s infinite}
@keyframes gpulse{50%{stroke-width:7;opacity:.5}}
.g-lbl{font-size:13px;font-weight:900;font-family:Nunito,sans-serif}
.gwrap{background:#fff;border-radius:18px;padding:8px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:14px;font-weight:800;color:var(--muted);margin-top:6px}

/* Slider */
.slider-box{background:#F7F8FD;border-radius:18px;padding:14px;margin-top:12px}
input[type=range]{width:100%;height:36px;accent-color:var(--tc);cursor:pointer}
.readout{font-size:19px;font-weight:800;text-align:center;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.readout .l{color:#2563EB}.readout .r{color:#EA580C}

/* Animación de acercamiento */
.approach{position:relative;height:150px;background:#F7F8FD;border-radius:18px;overflow:hidden}
.ap-line{position:absolute;left:5%;right:5%;top:70px;height:4px;background:#C9CFE3;border-radius:4px}
.ap-a{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:4px;height:40px;background:var(--tc);border-radius:4px}
.ap-a span{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-weight:900;font-size:20px;color:var(--tc)}
.ap-dot{position:absolute;top:60px;width:24px;height:24px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ap-dot.l{background:#2563EB;animation:apl 3.2s ease-in-out infinite}
.ap-dot.r{background:#EA580C;animation:apr 3.2s ease-in-out infinite}
@keyframes apl{0%{left:6%}75%,100%{left:calc(50% - 30px)}}
@keyframes apr{0%{right:6%}75%,100%{right:calc(50% - 30px)}}
.ap-lbl{position:absolute;top:12px;font-size:14px;font-weight:900;line-height:1.2}
.ap-lbl.l{left:6%;color:#2563EB}.ap-lbl.r{right:6%;color:#EA580C;text-align:right}
.ap-vals{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 6%;font-size:14px;font-weight:900}

/* Tablas de valores */
.vtable{width:100%;border-collapse:separate;border-spacing:4px;font-weight:800;text-align:center;font-size:16px}
.vtable th{background:var(--tc);color:#fff;border-radius:10px;padding:8px 6px}
.vtable td{background:#F4F6FC;border-radius:10px;padding:9px 4px}
.vtable td.c{background:var(--warn-l);color:#B45309;font-weight:900}
.vtable td.lft{color:#2563EB}.vtable td.rgt{color:#EA580C}
.tscroll{overflow-x:auto}

/* Ejemplos guiados */
.steps{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.step{display:flex;gap:12px;background:#F7F8FD;border-radius:16px;padding:14px;animation:enter .45s ease;align-items:flex-start}
.step .sn{width:34px;height:34px;border-radius:50%;background:var(--tc);color:#fff;font-weight:900;display:grid;place-items:center;flex:none}
.final{background:var(--ok-l);border:3px solid var(--ok);border-radius:18px;padding:16px;text-align:center;font-size:22px;font-weight:900;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.ex-count{font-weight:900;color:var(--tc);font-size:15px;text-transform:uppercase;letter-spacing:.05em}

/* Camino de progreso */
.pathbox{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px 22px 12px;margin-bottom:16px}
.path{position:relative;height:54px;margin:0 18px}
.ptrack{position:absolute;left:0;right:0;top:23px;height:10px;border-radius:10px;background:#E8EBF5}
.pfill{position:absolute;left:0;top:23px;height:10px;border-radius:10px;background:linear-gradient(90deg,var(--tc),color-mix(in srgb,var(--tc) 60%,#FBBF24));transition:width .7s cubic-bezier(.3,1.4,.5,1)}
.pdot{position:absolute;top:23px;width:10px;height:10px;border-radius:50%;background:#C8CEE0;transform:translateX(-50%);transition:background .3s}
.pdot.on{background:#fff}
.pnode{position:absolute;top:4px;width:48px;height:48px;margin-left:-24px;border-radius:50%;background:#fff;border:4px solid #E1E5F1;display:grid;place-items:center;font-size:22px;transition:all .4s;filter:grayscale(1);opacity:.75}
.pnode.on{border-color:var(--tc);filter:none;opacity:1;box-shadow:0 0 0 6px color-mix(in srgb,var(--tc) 18%,transparent)}
.pnode.pop{animation:nodepop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes nodepop{0%{transform:scale(1)}40%{transform:scale(1.55) rotate(-12deg)}100%{transform:scale(1)}}
.plabel{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-size:15px;margin-top:6px;gap:8px;flex-wrap:wrap}
.plabel b{color:var(--ink)}

/* Ejercicio */
.exgrid{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:900px){.exgrid{grid-template-columns:1.1fr 1fr;align-items:start}}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:900;background:color-mix(in srgb,var(--tc) 14%,#fff);color:var(--tc);padding:5px 12px;border-radius:999px}
.prompt{font-size:20px;font-weight:800}
.field{margin-bottom:14px;border-radius:18px;padding:10px;transition:background .3s}
.field>label{display:block;font-weight:900;font-size:20px;margin-bottom:8px}
.field.wrong{background:var(--bad-l);animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.numrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:22px;font-weight:900}
.ans{width:132px;height:68px;font:inherit;font-size:32px;font-weight:900;text-align:center;border-radius:18px;border:3px solid #D3D9EA;background:#F8F9FD;color:var(--ink);caret-color:var(--tc);transition:all .2s}
.ans:focus,.ans.active{border-color:var(--tc);background:#fff;outline:none;box-shadow:0 0 0 5px color-mix(in srgb,var(--tc) 18%,transparent)}
.field.wrong .ans{border-color:var(--bad)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:3px solid #D3D9EA;background:#fff;border-radius:18px;padding:14px 16px;font-size:19px;font-weight:800;text-align:left;box-shadow:0 4px 0 #D3D9EA;transition:all .12s;min-height:60px}
.opts.two .opt{text-align:center}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #D3D9EA}
.opt.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,#fff);box-shadow:0 4px 0 var(--tc)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 16px}
.key{height:56px;border:none;border-radius:14px;background:#F1F3FA;font-size:24px;font-weight:900;box-shadow:0 3px 0 #D8DDEC;transition:transform .08s}
.key:active{transform:translateY(3px);box-shadow:none;background:#E4E8F4}
.key.w2{grid-column:span 2}
.key.fn{background:color-mix(in srgb,var(--tc) 14%,#fff);color:var(--tc);font-size:19px}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.hint-note{font-size:14px;color:var(--muted);font-weight:700;margin:-6px 0 12px}

/* Panel práctica sin fin */
.estats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:560px){.estats{grid-template-columns:repeat(2,1fr)}}
.estats .stat .v{font-size:22px}
.mastery{height:10px;background:#E8EBF5;border-radius:10px;overflow:hidden;margin-top:6px}

.tswitch{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}

/* Hoja de retroalimentación */
.sheet-wrap{position:fixed;inset:0;z-index:100;background:rgba(20,22,45,.38);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-wrap.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:640px;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,1.1,.3,1);max-height:88vh;overflow-y:auto}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:28px;transform:translateY(40px) scale(.95)}}
.sheet-wrap.show .sheet{transform:none}
.sheet.ok{border-top:8px solid var(--ok)}
.sheet.bad{border-top:8px solid var(--bad)}
.sh-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.sh-ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff;flex:none;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.ok .sh-ico{background:var(--ok)}
.bad .sh-ico{background:var(--bad);animation:popin .5s cubic-bezier(.2,1.6,.4,1),shake .5s .4s}
.sh-head h3{font-size:26px}
.ok .sh-head h3{color:var(--ok)}
.bad .sh-head h3{color:var(--bad)}
.sh-head p{font-weight:700;color:var(--muted);margin:2px 0 0}
.sh-body{background:#F7F8FD;border-radius:16px;padding:14px;margin-bottom:16px;font-weight:700}
.drow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border:none}
.drow .e{font-size:26px;flex:none}
.drow>div>b:first-child{display:block}
.drow.hint{background:var(--warn-l);border-radius:14px;padding:12px;margin-top:6px;border:none}

/* Modal de logro */
.modal-wrap{position:fixed;inset:0;z-index:110;background:rgba(20,22,45,.5);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-wrap.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:520px;background:#fff;border-radius:30px;padding:26px 22px;text-align:center;transform:scale(.7);transition:transform .5s cubic-bezier(.2,1.5,.4,1);max-height:92vh;overflow-y:auto}
.modal-wrap.show .modal{transform:none}
.trophy{font-size:84px;line-height:1;animation:trophy 1.6s ease-in-out infinite}
@keyframes trophy{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.1)}}
.modal h2{font-size:30px;margin:8px 0 4px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.rbox{background:#F7F8FD;border-radius:16px;padding:12px;text-align:left}
.rbox .k{font-size:13px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.rbox .v{font-size:22px;font-weight:900;overflow-wrap:anywhere}
.rbox.ok .v{color:var(--ok)}.rbox.bad .v{color:var(--bad)}
.rbox.full{grid-column:span 2}
.mot{background:linear-gradient(135deg,#EEF0FF,#E6F7FF);border-radius:16px;padding:14px;font-weight:800;font-size:18px;margin-bottom:16px}
.mbtns{display:grid;gap:12px}

/* Toast */
#toasts{position:fixed;top:92px;left:0;right:0;z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:#1B1F3B;color:#fff;font-weight:900;font-size:18px;padding:14px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .5s cubic-bezier(.2,1.5,.4,1),toastout .4s 2.6s forwards;text-align:center;max-width:520px}
.toast.gold{background:linear-gradient(135deg,#F59E0B,#F97316)}
.toast.green{background:var(--ok)}
.toast.info{background:var(--pri)}
@keyframes toastin{from{transform:translateY(-30px) scale(.8);opacity:0}}
@keyframes toastout{to{transform:translateY(-20px);opacity:0}}
@media(max-width:560px){#toasts{top:120px}}

/* Confeti */
.confetti{position:fixed;top:-20px;width:11px;height:16px;z-index:130;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));}}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>

<header id="topbar" aria-label="Información del estudiante">
  <div class="tb-in">

<main id="main"></main>

<div class="sheet-wrap" id="sheetWrap" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="modal-wrap" id="modalWrap" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* =========================================================
   UTILIDADES
   ========================================================= */
const $=s=>document.querySelector(s);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const eq=(a,b)=>Math.abs(a-b)<1e-6;
/* Formatea números con signo − y coma decimal */
function N(n){
  if(typeof n!=='number')return n;
  if(Object.is(n,-0))n=0;
  const s=Number.isInteger(n)?String(Math.abs(n)):String(+Math.abs(n).toFixed(4)).replace('.',',');
  return (n<0?'−':'')+s;
}
function parseNum(s){
  s=String(s).trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s/g,'');
  if(!s)return NaN;
  if(s.includes('/')){
    const p=s.split('/');if(p.length!==2||p[0]===''||p[1]==='')return NaN;
    const x=+p[0],y=+p[1];if(!isFinite(x)||!isFinite(y)||y===0)return NaN;return x/y;
  }
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s))return NaN;
  return +s;
}
function numOk(val,raw,ans){
  if(eq(val,ans))return true;
  if(!Number.isInteger(ans)&&/[.,]/.test(raw)&&Math.abs(val-ans)<0.006)return true;
  return false;
}
/* Fracción reducida */
function frac(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
function fracTxt(n,d){const f=frac(n,d);return f.d===1?N(f.n):`${f.n<0?'−':''}${Math.abs(f.n)}/${f.d}`}
function fracH(n,d){const f=frac(n,d);return f.d===1?N(f.n):`${f.n<0?'−':''}${fr(Math.abs(f.n),f.d)}`}
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const lim=(a,side='')=>`<span class="lim"><span>lim</span><small>x→${N(a)}${side?`<sup>${side}</sup>`:''}</small></span>`;
const sqrtH=e=>`<span class="sqrt">√<span>${e}</span></span>`;
const fmtTime=ms=>{const s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

/* Polinomios: terms = [[coef, potencia], ...] */
const SUP={2:'²',3:'³'};
function termsStr(terms){
  let out='';
  terms.forEach(([c,p])=>{
    if(c===0)return;const neg=c<0,a=Math.abs(c);
    const body=p===0?String(a):((a===1?'':a)+'x'+(SUP[p]||''));
    out+=out===''?(neg?'−':'')+body:(neg?' − ':' + ')+body;
  });
  return out||'0';
}
function subStr(terms,a){
  const A=a<0?`(−${-a})`:`(${a})`;let out='';
  terms.forEach(([c,p])=>{
    if(c===0)return;const neg=c<0,ab=Math.abs(c);
    const body=p===0?String(ab):((ab===1?'':ab+'·')+A+(SUP[p]||''));
    out+=out===''?(neg?'−':'')+body:(neg?' − ':' + ')+body;
  });
  return out||'0';
}
const evalT=(terms,x)=>terms.reduce((s,[c,p])=>s+c*Math.pow(x,p),0);
function polySteps(terms,a){
  const parts=terms.filter(t=>t[0]!==0).map(([c,p])=>c*Math.pow(a,p));
  let s2='';parts.forEach((v,i)=>{s2+=i===0?N(v):(v<0?' − ':' + ')+N(Math.abs(v))});
  const res=N(evalT(terms,a));
  return parts.length>1?`${subStr(terms,a)} = ${s2} = <b>${res}</b>`:`${subStr(terms,a)} = <b>${res}</b>`;
}

/* =========================================================
   GRÁFICAS SVG
   ========================================================= */
let gid=0;
function mapr(o){
  const W=340,H=280,xmin=o.xmin??-5,xmax=o.xmax??5,ymin=o.ymin??-4,ymax=o.ymax??7;
  return{W,H,xmin,xmax,ymin,ymax,sx:x=>+((x-xmin)/(xmax-xmin)*W).toFixed(2),sy:y=>+(H-(y-ymin)/(ymax-ymin)*H).toFixed(2)};
}
function graph(o){
  const m=mapr(o),{W,H,xmin,xmax,ymin,ymax,sx,sy}=m,id='cl'+(++gid),col=o.color||'#5B4BDB';
  let s=`<svg class="graph" viewBox="-2 -2 ${W+4} ${H+4}" role="img" aria-label="${o.label||'Gráfica de la función f'}"><defs><clipPath id="${id}"><rect width="${W}" height="${H}" rx="14"/></clipPath></defs>`;
  s+=`<rect width="${W}" height="${H}" class="g-bg" rx="14"/>`;
  for(let x=Math.ceil(xmin);x<=xmax;x++)s+=`<line x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}" class="g-grid"/>`;
  for(let y=Math.ceil(ymin);y<=ymax;y++)s+=`<line x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}" class="g-grid"/>`;
  s+=`<line x1="0" y1="${sy(0)}" x2="${W}" y2="${sy(0)}" class="g-axis"/><line x1="${sx(0)}" y1="0" x2="${sx(0)}" y2="${H}" class="g-axis"/>`;
  for(let x=Math.ceil(xmin)+1;x<xmax;x++)if(x)s+=`<text x="${sx(x)}" y="${sy(0)+15}" class="g-num" text-anchor="middle">${N(x)}</text>`;
  for(let y=Math.ceil(ymin)+1;y<ymax;y++)if(y)s+=`<text x="${sx(0)-5}" y="${sy(y)+4}" class="g-num" text-anchor="end">${N(y)}</text>`;
  s+=`<text x="${W-8}" y="${sy(0)-6}" class="g-num" text-anchor="end">x</text><text x="${sx(0)+6}" y="13" class="g-num">y</text>`;
  if(o.markX!=null)s+=`<line x1="${sx(o.markX)}" y1="0" x2="${sx(o.markX)}" y2="${H}" class="g-mark"/>`;
  s+=`<g clip-path="url(#${id})">`;
  (o.guides||[]).forEach(g=>{s+=`<line x1="${sx(g.x)}" y1="${sy(0)}" x2="${sx(g.x)}" y2="${sy(g.y)}" class="g-guide"/><line x1="${sx(0)}" y1="${sy(g.y)}" x2="${sx(g.x)}" y2="${sy(g.y)}" class="g-guide"/>`});
  (o.pieces||[]).forEach(p=>{
    const from=Math.max(p.from,xmin-.5),to=Math.min(p.to,xmax+.5),n=160;let d='',pen=false;
    for(let i=0;i<=n;i++){const x=from+(to-from)*i/n,y=p.f(x);if(!isFinite(y)||y>ymax+20||y<ymin-20){pen=false;continue}d+=(pen?'L':'M')+sx(x)+' '+sy(y)+' ';pen=true}
    s+=`<path d="${d}" class="g-curve" style="stroke:${p.color||col}"/>`;
  });
  s+=`</g>`;
  (o.points||[]).forEach(p=>{const c=p.color||col;s+=p.open?`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="6.5" fill="#fff" stroke="${c}" stroke-width="3.5"/>`:`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="7" fill="${c}" stroke="#fff" stroke-width="2"/>`});
  (o.labels||[]).forEach(l=>{s+=`<text x="${sx(l.x)}" y="${sy(l.y)}" class="g-lbl" fill="${l.c||col}" text-anchor="${l.anchor||'middle'}">${l.t}</text>`});
  if(o.overlay)s+=`<g id="${o.overlay}"></g>`;
  return s+`</svg>`;
}
function dotG(m,x,y,col){
  return `<line x1="${m.sx(x)}" y1="${m.sy(0)}" x2="${m.sx(x)}" y2="${m.sy(y)}" class="g-guide"/><line x1="${m.sx(0)}" y1="${m.sy(y)}" x2="${m.sx(x)}" y2="${m.sy(y)}" class="g-guide"/><circle cx="${m.sx(x)}" cy="${m.sy(y)}" r="9" fill="${col}" stroke="#fff" stroke-width="3"/>`;
}
const legendOC=`<div class="legend"><span>○ = punto que NO está (hueco)</span><span>● = punto que SÍ está</span></div>`;

/* =========================================================
   DATOS DE LOS TEMAS
   ========================================================= */
const TOPICS={
  concepto:{name:'Concepto de límite',icon:'🎯',hex:'#6D5DF5',desc:'Descubre a qué valor se acerca una función cuando x se acerca a un número.'},
  laterales:{name:'Límites laterales',icon:'↔️',hex:'#0EA5E9',desc:'Acércate por la izquierda y por la derecha. ¿Llegan al mismo lugar?'},
  sustitucion:{name:'Sustitución directa',icon:'🔁',hex:'#F97316',desc:'Reemplaza x por el número y calcula el límite paso a paso.'}
};
const ORDER=['concepto','laterales','sustitucion'];
const BLUE='#2563EB',ORANGE='#EA580C';
let animTimer=null;
function stopAnim(){if(animTimer){clearInterval(animTimer);animTimer=null}}

/* ---------- TEORÍA ---------- */
const GC2={pieces:[{f:x=>x+2,from:-5,to:5}],points:[{x:2,y:4,open:true}],markX:2,overlay:'ovl',color:TOPICS.concepto.hex};
const GL2={pieces:[{f:x=>x+1,from:-5,to:2,color:BLUE},{f:x=>-x+7,from:2,to:5,color:ORANGE}],points:[{x:2,y:3,open:true,color:BLUE},{x:2,y:5,color:ORANGE}],markX:2,overlay:'ovl2',color:TOPICS.laterales.hex};

const THEORY={
concepto:[
 {t:'¿Qué es un límite?',text:`<p>El <b>límite</b> responde una pregunta muy sencilla:</p>
  <div class="big-q">Cuando <b>x</b> se acerca a un número <b>a</b>, ¿a qué valor se acerca <b>f(x)</b>?</div>
  <div class="notation">${lim('a')} f(x) = L</div>
  <p>Se lee: <i>“el límite de f(x) cuando x tiende a a es L”</i>.</p>
  <div class="tip">💡 <b>“Tiende a”</b> significa <b>acercarse cada vez más</b>, sin necesidad de llegar.</div>`,
  vis:`<div class="approach"><div class="ap-lbl l">x se acerca<br>por la izquierda</div><div class="ap-lbl r">x se acerca<br>por la derecha</div><div class="ap-line"></div><div class="ap-a"><span>a</span></div><div class="ap-dot l"></div><div class="ap-dot r"></div></div>
  <p class="muted" style="text-align:center;font-weight:700;margin-top:10px">Los puntos se acercan a <b>a</b> desde ambos lados… ¡cada vez más cerca!</p>`},
 {t:'Míralo en una gráfica',text:`<p>Observa la función <b>f(x) = ${fr('x² − 4','x − 2')}</b>.</p>
  <p>En <b>x = 2</b> se divide entre cero, así que <b>f(2) no existe</b>: por eso hay un hueco ○.</p>
  <div class="big-q">🎚️ Mueve el deslizador y mira qué pasa con f(x) cuando x se acerca a 2.</div>
  <div class="keybox">✅ Aunque f(2) no existe, f(x) se acerca a <b>4</b>.<br>Por eso: ${lim(2)} f(x) = 4</div>`,
  vis:`<div class="gwrap">${graph(GC2)}</div>
  <div class="slider-box"><input type="range" id="sl" min="0" max="4" step="0.01" value="1" aria-label="Valor de x"><div class="readout" id="ro"></div>
  <button class="btn ghost block" id="animBtn">▶ Animar el acercamiento</button></div>`,
  init(){
    const m=mapr(GC2),sl=$('#sl'),ov=$('#ovl'),ro=$('#ro'),col=GC2.color;
    const upd=()=>{const x=+sl.value;
      if(Math.abs(x-2)<1e-9){ov.innerHTML=`<circle cx="${m.sx(2)}" cy="${m.sy(4)}" r="12" class="g-pulse"/>`;ro.innerHTML=`<span>x = 2 → <b>f(2) no existe</b> (hueco ○)</span><span class="muted">¡Pero alrededor, f(x) se acerca a 4!</span>`;return}
      const y=x+2;ov.innerHTML=dotG(m,x,y,col);
      ro.innerHTML=`<span>x = <b>${N(x)}</b> &nbsp;→&nbsp; f(x) = <b style="color:${col}">${N(+y.toFixed(2))}</b></span><span class="muted">Distancia de x a 2: ${N(+Math.abs(x-2).toFixed(2))}</span>`};
    sl.oninput=()=>{stopAnim();upd()};upd();
    $('#animBtn').onclick=()=>{stopAnim();const seq=[0.5,1,1.5,1.8,1.9,1.95,1.99,3.5,3,2.5,2.2,2.1,2.05,2.01];let i=0;
      animTimer=setInterval(()=>{if(i>=seq.length){stopAnim();return}sl.value=seq[i++];upd()},600)};
  }},
 {t:'Con una tabla de valores',text:`<p>También podemos descubrir el límite con una <b>tabla</b>: tomamos valores de x cada vez más cercanos a 2.</p>
  <p>🔵 Por la izquierda: 1,9 → 1,99 → 1,999<br>🟠 Por la derecha: 2,1 → 2,01 → 2,001</p>
  <div class="keybox">Los valores de f(x) se acercan a <b>4</b> por ambos lados. ✅</div>
  <div class="tip">💡 Para encontrar el límite, mira los valores de f(x) <b>más cercanos al centro</b>.</div>`,
  vis:`<div class="card" style="box-shadow:none;background:#F7F8FD"><div class="tscroll"><table class="vtable">
  <tr><th>x</th><td class="lft">1,9</td><td class="lft">1,99</td><td class="lft">1,999</td><td class="c">2</td><td class="rgt">2,001</td><td class="rgt">2,01</td><td class="rgt">2,1</td></tr>
  <tr><th>f(x)</th><td class="lft">3,9</td><td class="lft">3,99</td><td class="lft">3,999</td><td class="c">→4←</td><td class="rgt">4,001</td><td class="rgt">4,01</td><td class="rgt">4,1</td></tr></table></div>
  <p style="text-align:center;font-weight:900;font-size:22px;margin-top:14px">${lim(2)} f(x) = 4</p></div>`},
 {t:'El límite NO es lo mismo que f(a)',text:`<p>En esta gráfica pasa algo curioso en <b>x = 1</b>:</p>
  <ul class="clean"><li data-i="●">El punto relleno está en <b>y = 6</b>, así que <b>f(1) = 6</b>.</li>
  <li data-i="○">Pero la curva, cerca de x = 1, se acerca a <b>y = 3</b>.</li></ul>
  <div class="keybox">${lim(1)} f(x) = 3 &nbsp; pero &nbsp; f(1) = 6</div>
  <div class="tip">🧠 <b>Idea clave:</b> el límite mira lo que pasa <b>cerca</b> de a, no lo que pasa <b>exactamente en</b> a.</div>`,
  vis:`<div class="gwrap">${graph({pieces:[{f:x=>2*x+1,from:-5,to:5}],points:[{x:1,y:3,open:true},{x:1,y:6}],markX:1,color:'#6D5DF5',labels:[{x:1.35,y:6.2,t:'f(1) = 6',anchor:'start',c:'#1B1F3B'},{x:1.4,y:2.6,t:'límite = 3',anchor:'start',c:'#6D5DF5'}]})}</div>${legendOC}`}
],
laterales:[
 {t:'Dos formas de acercarse',text:`<p>Podemos acercarnos a un número <b>a</b> por dos caminos:</p>
  <div class="big-q" style="border-color:${BLUE}">🔵 <b>Por la izquierda</b> (valores menores que a):<br><span style="font-size:24px">${lim('a','−')} f(x)</span></div>
  <div class="big-q" style="border-color:${ORANGE}">🟠 <b>Por la derecha</b> (valores mayores que a):<br><span style="font-size:24px">${lim('a','+')} f(x)</span></div>
  <div class="tip">💡 El signo <b>⁻</b> significa “desde abajo/izquierda” y el signo <b>⁺</b> “desde arriba/derecha”.</div>`,
  vis:`<div class="approach" style="height:170px"><div class="ap-lbl l">x → 3⁻</div><div class="ap-lbl r">x → 3⁺</div><div class="ap-line"></div><div class="ap-a"><span>3</span></div><div class="ap-dot l"></div><div class="ap-dot r"></div>

]};

/* ---- CONCEPTO ---- */
function genC_graph(){
  const a=ri(-3,3),col=TOPICS.concepto.hex;let f;
  if(Math.random()<.5){const m=pick([-2,-1,-.5,.5,1,2]),L0=ri(-2,5);f=x=>m*(x-a)+L0}
  else{const d=pick([-2,-1,1,2]),h=a-d,k=ri(-3,5-d*d);f=x=>(x-h)*(x-h)+k}
  const L=f(a),withPt=Math.random()<.5;let P=null;
  if(withPt){do{P=ri(-3,6)}while(P===L)}
  const pts=[{x:a,y:L,open:true}];if(withPt)pts.push({x:a,y:P});
  return{type:'Lectura de gráfica',prompt:`Observa la gráfica. ¿A qué valor se acerca f(x) cuando x se acerca a ${N(a)}?`,
    visual:graph({pieces:[{f,from:-5,to:5}],points:pts,markX:a,color:col})+legendOC,
    fields:[{id:'l',type:'num',label:`${lim(a)} f(x) =`,ans:L}],
    diagnose(v){const u=v.l;
      if(withPt&&eq(u,P))return{err:`Escribiste ${N(P)}, que es el valor de <b>f(${N(a)})</b> (el punto relleno ●).`,check:`El límite no depende de lo que pasa exactamente en x = ${N(a)}, sino de hacia dónde se acerca la curva.`,hint:`Sigue la curva con el dedo hacia la línea punteada. ¿A qué altura está el hueco ○?`};
      if(eq(u,a)&&!eq(a,L))return{err:`Escribiste ${N(a)}, que es el valor de <b>x</b>.`,check:'El límite es un valor de <b>y</b>: la altura a la que se acerca la curva.',hint:'Mira el eje vertical a la altura del hueco ○.'};
      return{err:`La curva no se acerca a la altura ${N(u)}.`,check:`Revisa la altura de la curva justo sobre la línea punteada x = ${N(a)}.`,hint:'Cuenta los cuadritos desde el eje x hasta el hueco ○ (hacia arriba son positivos, hacia abajo negativos).'};},
    explain:`Al acercarnos a x = ${N(a)} por ambos lados, la curva se acerca a la altura <b>${N(L)}</b>. Por eso ${lim(a)} f(x) = ${N(L)}.${withPt?` El punto ● en y = ${N(P)} es f(${N(a)}), y no cambia el límite.`:''}`};
}
function genC_table(){
  const a=ri(-4,5),m=pick([-3,-2,-1,1,2,3]),L=ri(-6,9),f=x=>m*(x-a)+L;
  const xl=[a-.1,a-.01,a-.001],xr=[a+.001,a+.01,a+.1],fv=x=>N(+f(x).toFixed(3));
  const t=`<div class="tscroll"><table class="vtable"><tr><th>x</th>${xl.map(x=>`<td class="lft">${N(+x.toFixed(3))}</td>`).join('')}<td class="c">${N(a)}</td>${xr.map(x=>`<td class="rgt">${N(+x.toFixed(3))}</td>`).join('')}</tr><tr><th>f(x)</th>${xl.map(x=>`<td class="lft">${fv(x)}</td>`).join('')}<td class="c">?</td>${xr.map(x=>`<td class="rgt">${fv(x)}</td>`).join('')}</tr></table></div>`;
  return{type:'Tabla de valores',prompt:`La tabla muestra valores de f(x) cuando x se acerca a ${N(a)}. ¿Cuál es el límite?`,visual:t,
    fields:[{id:'l',type:'num',label:`${lim(a)} f(x) =`,ans:L}],
    diagnose(v){const u=v.l;
      if(eq(u,a))return{err:`${N(a)} es el número al que se acerca <b>x</b>, no f(x).`,check:'Lee la fila de <b>f(x)</b> (la de abajo).',hint:`Observa: ${fv(a-.001)} y ${fv(a+.001)}. ¿Qué número entero está entre ellos?`};
      if(Math.abs(u-L)<.2)return{err:'Tu respuesta está muy cerca, pero no es exacta.',check:'El límite es el número exacto al que se acercan los valores, no uno de los valores de la tabla.',hint:`Los valores ${fv(a-.001)} y ${fv(a+.001)} están a ambos lados de un número entero.`};
      return{err:`Los valores de f(x) no se acercan a ${N(u)}.`,check:'Mira las columnas más cercanas al centro de la tabla.',hint:`Fíjate en ${fv(a-.001)} (izquierda) y ${fv(a+.001)} (derecha).`};},
    explain:`Por la izquierda los valores van ${fv(a-.1)} → ${fv(a-.01)} → ${fv(a-.001)} y por la derecha ${fv(a+.1)} → ${fv(a+.01)} → ${fv(a+.001)}. Ambos se acercan a <b>${N(L)}</b>.`};
}
function genC_two(){

    fields:[{id:'fa',type:'num',label:`f(${N(a)}) =`,ans:P},{id:'l',type:'num',label:`${lim(a)} f(x) =`,ans:L}],

      if(eq(v.fa,L)&&eq(v.l,P))return{err:'¡Intercambiaste los valores!',check:'<b>f(a)</b> es el punto relleno ●. El <b>límite</b> es la altura a la que se acerca la curva (el hueco ○).',hint:'Relleno ● = “aquí está la función”. Hueco ○ = “aquí se acerca la curva”.'};

/* ---- LATERALES ---- */
function latDiag(v,w,Lf,Rf,a,ctx){
  const exists=Lf===Rf;
  if(w.includes('i')&&w.includes('d')&&eq(v.i,Rf)&&eq(v.d,Lf))return{err:'Parece que <b>intercambiaste los lados</b>.',check:`x → ${N(a)}⁻ significa acercarse desde la <b>IZQUIERDA</b> (valores menores que ${N(a)}). x → ${N(a)}⁺ es desde la <b>DERECHA</b>.`,hint:'El signo ⁻ es izquierda 🔵 y el signo ⁺ es derecha 🟠.'};
  if(w.includes('i'))return ctx.left(v.i);
  if(w.includes('d'))return ctx.right(v.d);
  return{err:'Tus límites laterales están bien 👍, pero la conclusión no.',check:'Compara los dos valores que escribiste.',hint:'El límite existe <b>solo si</b> el límite por la izquierda es IGUAL al de la derecha.'};
}
function latExplain(Lf,Rf,a){return Lf===Rf?`Como ambos son iguales (${N(Lf)} = ${N(Rf)}), el límite <b>existe</b> y ${lim(a)} f(x) = ${N(Lf)}.`:`Como son diferentes (${N(Lf)} ≠ ${N(Rf)}), el límite <b>no existe</b>.`}

/* ---- SUSTITUCIÓN DIRECTA ---- */
function polyEx(terms,a,type,extraDiag){
  const ans=evalT(terms,a);
  return{type,prompt:'Calcula el límite usando sustitución directa.',visual:`<div class="math">${lim(a)} (${termsStr(terms)})</div>`,
    fields:[{id:'r',type:'num',label:'Resultado =',ans}],
    diagnose(v){const u=v.r;return (extraDiag&&extraDiag(u))||genericDiag(u,ans,`Empieza así: ${subStr(terms,a)}`)||{err:`El resultado no es ${N(u)}.`,check:'Sustituye x con paréntesis y resuelve en orden: <b>potencias → multiplicaciones → sumas y restas</b>.',hint:`Empieza así: ${subStr(terms,a)} = ?`}},
    explain:`Es un polinomio, así que sustituimos x = ${N(a)}:<br>${polySteps(terms,a)}`};
}
function genS_poly(){
  const p=pick([1,1,2,3,-1,-2]),q=ri(-6,6),r=ri(-9,9);let a;do{a=ri(-4,4)}while(a===0);
  const T=[[p,2],[q,1],[r,0]];
  return polyEx(T,a,'Polinomio',u=>{
    if(a<0&&eq(u,-p*a*a+q*a+r))return{err:'Error con el signo de la potencia.',check:`Observa el signo: (${N(a)})² = ${a*a}, es <b>positivo</b> (menos por menos da más).`,hint:`Usa paréntesis: ${p===1?'':p+'·'}(${N(a)})² = ${N(p*a*a)}`};
    if(eq(u,p*2*a+q*a+r))return{err:'Error en la potencia.',check:'x² significa <b>x·x</b>, no 2·x.',hint:`(${N(a)})² = (${N(a)})·(${N(a)}) = ${a*a}`};
    if(p!==1&&eq(u,a*a+q*a+r))return{err:'Olvidaste un coeficiente.',check:`Te faltó multiplicar por <b>${N(p)}</b> el término con x².`,hint:`${N(p)}·(${N(a)})² = ${N(p*a*a)}`};
    if(q!==0&&eq(u,p*a*a-q*a+r))return{err:'Revisa la multiplicación del término con x.',check:`Observa el signo de ${termsStr([[q,1]])} cuando x = ${N(a)}. Recuerda la ley de signos.`,hint:`${N(q)}·(${N(a)}) = ${N(q*a)}`};
    if(eq(u,p*a*a+q*a))return{err:'La suma parece tener un error.',check:`Olvidaste sumar el término independiente <b>${N(r)}</b>.`,hint:'Revisa que hayas incluido todos los términos.'};
    return null});
}
function genS_cubic(){
  let a;do{a=ri(-3,3)}while(a===0);

    if(a<0&&eq(u,-c3*a*a*a+q*a+r))return{err:'Error con el signo del cubo.',check:`Un número negativo elevado al cubo es <b>negativo</b>: (${N(a)})³ = ${N(a*a*a)}.`,hint:`(${N(a)})·(${N(a)})·(${N(a)}) = ${N(a*a*a)}`};
    if(eq(u,c3*3*a+q*a+r))return{err:'Error en la potencia.',check:'x³ significa <b>x·x·x</b>, no 3·x.',hint:`(${N(a)})³ = ${N(a*a*a)}`};
    if(eq(u,c3*a*a+q*a+r))return{err:'Error en la potencia.',check:'Elevaste al cuadrado en lugar de al cubo.',hint:`(${N(a)})³ = (${N(a)})·(${N(a)})·(${N(a)})`};

}
function genS_prod(){

function genS_rat(){

  if(Math.random()<.6){const k=ri(-5,5);q=k*den-p*a}else q=ri(-8,8);

  return{type:'Fracción',prompt:'Calcula el límite usando sustitución directa.',visual:`<div class="math">${lim(a)} ${fr(termsStr(N1),termsStr(D1))}</div>`,
    fields:[{id:'r',type:'num',label:'Resultado =',ans}],note:F.d!==1?'💡 Puedes escribir fracciones con / (ejemplo: 3/4).':'💡 Si el resultado es fracción, escríbela con / (ejemplo: 3/4).',

    explain:`Denominador en x = ${N(a)}: ${polySteps(D1,a)} ≠ 0 ✔<br>Numerador: ${polySteps(N1,a)}<br>Resultado: ${fr(N(num),N(den))} = <b>${fracH(num,den)}</b>`};

function genS_root(){
  const p=pick([1,1,2,3]),a=ri(-3,6),k=ri(0,7),q=k*k-p*a,d=pick([0,0,ri(-5,5)]),R=[[p,1],[q,0]],ans=k+d;

    diagnose(v){const u=v.r;
      if(eq(u,k*k+d)&&k>1)return{err:'Te faltó sacar la <b>raíz cuadrada</b>.',check:`Lo de adentro da ${k*k}, pero luego hay que calcular √${k*k}.`,hint:`¿Qué número multiplicado por sí mismo da ${k*k}?`};
      if(eq(u,-k+d)&&k>0)return{err:'Observa el signo de la raíz.',check:'La raíz cuadrada √ siempre da un resultado <b>positivo</b>.',hint:`√${k*k} = ${k}`};

    explain:`Adentro de la raíz: ${polySteps(R,a)} ≥ 0 ✔<br>√${k*k} = ${k}${d?`<br>${k}${dTxt} = <b>${N(ans)}</b>`:` → resultado <b>${N(ans)}</b>`}`};
}

    fields:[{id:'c',type:'choice',options:[{v:'si',h:'✅ Sí, se puede'},{v:'no',h:'⚠️ No, el denominador da 0'}],two:false,ans:yes?'si':'no'}],
    diagnose(){return yes?{err:'Sí se puede: el denominador <b>no</b> se hace cero.',check:`Sustituye x = ${N(a)} en el denominador ${termsStr(D)}.`,hint:`${subStr(D,a)} = ?`}
      :{err:'No se puede: el denominador se hace <b>cero</b>.',check:`Sustituye x = ${N(a)} en el denominador ${termsStr(D)}.`,hint:`${subStr(D,a)} = ? ¡No se puede dividir entre 0!`}},
    explain:yes?`El denominador en x = ${N(a)} vale ${polySteps(D,a)} ≠ 0, así que sí se puede. El límite es ${fr(N(nv),N(dv))} = <b>${fracH(nv,dv)}</b>.`
      :`El denominador en x = ${N(a)} vale ${subStr(D,a)} = <b>0</b>. No se puede dividir entre cero, así que la sustitución directa no funciona aquí${nv===0?' (da 0/0, una indeterminación)':''}.`};
}

const GENS={
  concepto:[{w:3,f:genC_graph},{w:2,f:genC_table},{w:2,f:genC_two},{w:2,f:genC_mc}],
  laterales:[{w:3,f:genL_graph},{w:3,f:genL_piece},{w:2,f:genL_table}],
  sustitucion:[{w:3,f:genS_poly},{w:2,f:genS_cubic},{w:2,f:genS_rat},{w:2,f:genS_root},{w:2,f:genS_prod},{w:1,f:genS_can}]
};
function genExercise(topic,lastF){
  const list=GENS[topic];let g;
  for(let i=0;i<6;i++){const t=list.reduce((s,x)=>s+x.w,0);let r=Math.random()*t;g=list.find(x=>(r-=x.w)<0)||list[0];if(g.f!==lastF)break}
  const ex=g.f();ex.gen=g.f;return ex;
}

function newExercise(){

function renderExercise(){
  const ex=CUR.ex,hasNum=ex.fields.some(f=>f.type==='num'),numCount=ex.fields.filter(f=>f.type==='num').length;
  const fields=ex.fields.map(f=>f.type==='num'

  const keys=['7','8','9','del','4','5','6','−','1','2','3','/','0',',',numCount>1?'next':'clr'];
  const kp=hasNum?`<div class="keypad" aria-label="Teclado numérico">${keys.map(k=>`<button class="key ${k==='0'?'w2':''} ${['del','next','clr','−','/',','].includes(k)?'fn':''}" data-k="${k}">${{del:'⌫',next:'Sig. ▸',clr:'C'}[k]||k}</button>`).join('')}</div>`:'';
  $('#exBox').innerHTML=`<div class="card screen"><div class="exhead"><span class="ex-count">Ejercicio ${CUR.st.count}</span><span class="tag">${ex.type}</span></div>
   <div class="exgrid"><div><p class="prompt">${ex.prompt}</p>${ex.visual||''}</div>
   <div>${fields}${ex.note?`<p class="hint-note">${ex.note}</p>`:''}${kp}
    <div class="actions"><button class="btn ghost" id="clrBtn">🗑 Borrar</button><button class="btn ok" id="chkBtn">✅ Comprobar respuesta</button></div></div></div></div>`;
  const box=$('#exBox');
  box.querySelectorAll('input.ans').forEach(inp=>{
    inp.addEventListener('focus',()=>{activeInp=inp;inp.dataset.fresh='1';setTimeout(()=>{try{inp.select()}catch(e){}},0);markActive()});
    inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^0-9,.\-−\/]/g,'').slice(0,10);inp.dataset.fresh='0';unwrong(inp)});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkAnswer()}});
  });
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const f=b.closest('.field');f.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');unwrong(b)});
  box.querySelectorAll('.key').forEach(k=>k.onclick=()=>keyPress(k.dataset.k));
  $('#clrBtn').onclick=clearAnswers;$('#chkBtn').onclick=checkAnswer;
  activeInp=box.querySelector('input.ans');if(activeInp)activeInp.dataset.fresh='1';markActive();
}
function unwrong(el){el.closest('.field').classList.remove('wrong')}
function markActive(){document.querySelectorAll('#exBox input.ans').forEach(i=>i.classList.toggle('active',i===activeInp))}
function keyPress(k){
  const inps=[...document.querySelectorAll('#exBox input.ans')];if(!inps.length)return;
  if(!activeInp||!inps.includes(activeInp))activeInp=inps[0];const inp=activeInp;
  if(k==='next'){activeInp=inps[(inps.indexOf(inp)+1)%inps.length];activeInp.dataset.fresh='1';markActive();return}
  if(k==='clr'){inp.value='';inp.dataset.fresh='0'}
  else if(k==='del'){inp.value=inp.value.slice(0,-1);inp.dataset.fresh='0'}
  else{if(inp.dataset.fresh==='1')inp.value='';if(inp.value.length<10)inp.value+=k;inp.dataset.fresh='0'}
  unwrong(inp);markActive();
}
function clearAnswers(){
  const box=$('#exBox');box.querySelectorAll('input.ans').forEach(i=>{i.value='';i.dataset.fresh='1'});
  box.querySelectorAll('.opt.sel').forEach(o=>o.classList.remove('sel'));box.querySelectorAll('.field').forEach(f=>f.classList.remove('wrong'));
  activeInp=box.querySelector('input.ans');markActive();
}
function checkAnswer(){
  const ex=CUR&&CUR.ex;if(!ex||sheetOpen)return;
  const box=$('#exBox'),v={},raw={};let empty=null,bad=null;
  for(const f of ex.fields){
    const fe=box.querySelector(`.field[data-f="${f.id}"]`);
    if(f.type==='num'){const r=box.querySelector('#f_'+f.id).value.trim();raw[f.id]=r;if(!r){empty=empty||fe;continue}const n=parseNum(r);if(isNaN(n)){bad=bad||fe;continue}v[f.id]=n}
    else{const s=fe.querySelector('.opt.sel');if(!s){empty=empty||fe;continue}v[f.id]=s.dataset.v}
  }
  if(empty){toast('✍️ Completa todas las respuestas antes de comprobar.','info');shake(empty);return}
  if(bad){toast('🔢 Escribe un número válido. Ej: 5, −3, 2/3 o 1,5','info');shake(bad);return}
  const wrong=ex.fields.filter(f=>f.type==='num'?!numOk(v[f.id],raw[f.id],f.ans):v[f.id]!==String(f.ans)).map(f=>f.id);
  wrong.length?onWrong(v,wrong):onCorrect();
}
function shake(el){el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),700)}

function onCorrect(){
  const st=CUR.st;S.hits++;st.hits++;st.streak++;updTop();bump('#chOk');
  if(CUR.mode==='endless'){st.best=Math.max(st.best,st.streak);st.recent.push(true);if(st.recent.length>12)st.recent.shift();drawEStats()}
  const n=progN(),milestone=n%4===0;
  drawPath(milestone?n:undefined);
  if(n===4)toast('⭐ ¡Primer logro desbloqueado! Vas por muy buen camino.','gold');
  else if(n===8)toast('🚀 ¡Segundo logro! Ya casi completas esta meta.','gold');
  else if(n===12)confetti(60);
  else if(st.streak>=3&&st.streak%3===0)toast(`🔥 ${pick(MOTIV)} Racha de ${st.streak}`,'green');
  showSheet('ok',`<div class="sh-head"><div class="sh-ico">✔</div><div><h3>¡Excelente!</h3><p>${pick(OKMSG)}</p></div></div>
    <div class="sh-body"><b>¿Por qué es correcto?</b><p>${CUR.ex.explain}</p></div>
    <button class="btn ok block" id="shBtn">Continuar →</button>`,()=>{
      if(n===12){CUR.mode==='lesson'?finishLesson():levelUp()}else newExercise();
    });
}
function onWrong(v,wrong){
  const st=CUR.st;S.errs++;st.errs++;st.streak=0;updTop();bump('#chBad');
  if(CUR.mode==='endless'){st.recent.push(false);if(st.recent.length>12)st.recent.shift();drawEStats()}
  const d=CUR.ex.diagnose(v,wrong)||{err:'La respuesta no es correcta.',check:'Revisa cada paso con calma.',hint:'Vuelve a leer el enunciado.'};
  showSheet('bad',`<div class="sh-head"><div class="sh-ico">✖</div><div><h3>Inténtalo nuevamente</h3><p>${pick(BADSUB)}</p></div></div>
    <div class="sh-body"><div class="drow"><span class="e">🔍</span><div><b>Dónde estuvo el error</b>${d.err}</div></div>
    <div class="drow"><span class="e">👀</span><div><b>Qué revisar</b>${d.check}</div></div>
    <div class="drow hint"><span class="e">💡</span><div><b>Pista</b>${d.hint}</div></div></div>
    <button class="btn bad block" id="shBtn">↺ Volver a intentarlo</button>`,()=>{
      const box=$('#exBox');wrong.forEach(id=>{const f=box.querySelector(`.field[data-f="${id}"]`);if(f)shake(f),f.classList.add('wrong')});
      const fi=box.querySelector(`.field[data-f="${wrong[0]}"] input.ans`);if(fi){activeInp=fi;fi.dataset.fresh='1';markActive()}
      const ex=box.querySelector('.field.wrong');if(ex)ex.scrollIntoView({behavior:'smooth',block:'center'});
    });
}
function showSheet(type,html,onClose){
  sheetOpen=true;const sh=$('#sheet');sh.className='sheet '+type;sh.innerHTML=html;$('#sheetWrap').classList.add('show');
  const b=$('#shBtn');setTimeout(()=>b.focus(),300);
  b.onclick=()=>{closeSheet();onClose&&onClose()};
}
function closeSheet(){sheetOpen=false;$('#sheetWrap').classList.remove('show')}
document.addEventListener('keydown',e=>{if(sheetOpen&&(e.key==='Escape')){$('#shBtn').click()}});

/* ---------- LOGROS ---------- */
function resultHTML(hits,errs,ms){
  const tot=hits+errs,pct=tot?Math.round(hits/tot*100):100;
  return {pct,html:`<div class="rgrid">
   <div class="rbox full"><div class="k">👤 Estudiante</div><div class="v">${esc(S.name)}</div></div>
   <div class="rbox"><div class="k">🎓 Grado</div><div class="v">${S.grade}</div></div>
   <div class="rbox"><div class="k">⏱ Tiempo</div><div class="v">${fmtTime(ms)}</div></div>
   <div class="rbox ok"><div class="k">✔ Aciertos</div><div class="v">${hits}</div></div>
   <div class="rbox bad"><div class="k">✖ Errores</div><div class="v">${errs}</div></div>
   <div class="rbox full"><div class="k">📊 Porcentaje de acierto</div><div class="v">${pct}%</div><div class="mastery"><i style="width:${pct}%"></i></div></div></div>`};
}
function motivFor(p){return p>=90?'Excelente trabajo. Cada día mejoras más en matemáticas. 🌟':p>=70?'¡Muy bien! Tu esfuerzo está dando frutos. Sigue practicando. 💪':'¡Lo lograste! Cada error fue una oportunidad para aprender. 🧠'}
function finishLesson(){
  const t=CUR.topic,st=CUR.st,r=resultHTML(st.hits,st.errs,Date.now()-st.t0),idx=ORDER.indexOf(t),next=ORDER[idx+1];
  S.done[t]=true;save();confetti(140);
  showModal(`<div class="trophy">🏆</div><h2>🎉 ¡Lección completada!</h2><p class="muted" style="font-weight:800">${TOPICS[t].icon} ${TOPICS[t].name}</p>${r.html}
   <div class="mot">${motivFor(r.pct)}</div>
   <div class="mbtns">${next?`<button class="btn ok block" id="mNext">Siguiente lección: ${TOPICS[next].name} →</button>`:`<button class="btn ok block" id="mNext">♾️ Ir a la Práctica sin fin →</button>`}
   <button class="btn ghost block" id="mMenu">🏠 Volver al menú</button></div>`);
  delete S.lessons[t]; // la próxima vez la lección empieza de nuevo
  $('#mNext').onclick=()=>{closeModal();if(next)openLesson(next,'teoria');else{renderMenu();setTimeout(()=>$('#endlessSec').scrollIntoView({behavior:'smooth'}),300)}};
  $('#mMenu').onclick=()=>{closeModal();renderMenu()};
}
function levelUp(){
  const st=CUR.st,lv=st.level,r=resultHTML(st.hits,st.errs,Date.now()-st.t0);st.level++;confetti(120);
  showModal(`<div class="trophy">🏅</div><h2>¡Nivel ${lv} superado!</h2><p class="muted" style="font-weight:800">♾️ ${TOPICS[CUR.topic].name} · resultados acumulados</p>${r.html}
   <div class="mot">${motivFor(r.pct)}</div>
   <div class="mbtns"><button class="btn ok block" id="mNext">Seguir practicando: Nivel ${st.level} →</button><button class="btn ghost block" id="mMenu">🏠 Volver al menú</button></div>`);
  $('#mNext').onclick=()=>{closeModal();drawEStats();drawPath();newExercise()};
  $('#mMenu').onclick=()=>{closeModal();renderMenu()};
}
function showModal(html){$('#modal').innerHTML=html;$('#modalWrap').classList.add('show');setTimeout(()=>{const b=$('#mNext');b&&b.focus()},400)}
function closeModal(){$('#modalWrap').classList.remove('show')}

renderWelcome();
</script>
</body>
</html>
