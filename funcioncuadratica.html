<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parábola Lab · Función y ecuación cuadrática</title>
<meta name="description" content="App interactiva paso a paso: concavidad, coeficientes a b c, eje de simetría, vértice, foco, tabla de valores y ceros de la ecuación cuadrática.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --violeta:#5B3DF5; --violeta-osc:#4429D6; --violeta-luz:#EDE8FF;
  --tinta:#1B1544; --gris:#6C6790; --linea:#E4E0F5;
  --verde:#0FA968; --verde-luz:#E2F8EE;
  --rojo:#F0436A; --rojo-luz:#FFE8ED;
  --ambar:#FFB020; --ambar-luz:#FFF3DC;
  --cian:#12B4D8; --cian-luz:#E0F7FC;
  --papel:#F7F5FF; --blanco:#fff;
  --sombra:0 10px 30px rgba(27,21,68,.09);
  --sombra-sm:0 4px 14px rgba(27,21,68,.07);
  --r:22px; --barra:112px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--tinta); background:var(--papel);
  background-image:linear-gradient(rgba(91,61,245,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(91,61,245,.055) 1px,transparent 1px);
  background-size:26px 26px; font-size:17px; line-height:1.45; min-height:100dvh; overscroll-behavior-y:none;
}
h1,h2,h3{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;letter-spacing:.2px}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:1rem;color:inherit}
:focus-visible{outline:3px solid var(--violeta);outline-offset:3px;border-radius:8px}
.oculto{display:none !important}
i.v{font-style:italic;font-weight:800}

/* ---------- FRACCIONES ---------- */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;font-weight:800}
.fr b{padding:0 5px;font-weight:800}
.fr u{padding:1px 5px 0;border-top:2.5px solid currentColor;text-decoration:none;display:block;font-weight:800}
.rad{display:inline-flex;align-items:baseline}
.rad em{font-style:normal}
.rad u{text-decoration:none;border-top:2.5px solid currentColor;padding:1px 4px 0;margin-left:-1px}

/* ---------- BIENVENIDA ---------- */
#bienvenida{min-height:100dvh;display:grid;place-items:center;padding:22px}
.hero{max-width:460px;width:100%;background:var(--blanco);border-radius:30px;box-shadow:var(--sombra);padding:26px 22px 24px;text-align:center;animation:sube .5s ease both}
.marca{display:inline-flex;align-items:center;gap:9px;background:var(--violeta-luz);color:var(--violeta-osc);font-weight:800;font-size:.8rem;letter-spacing:1.4px;text-transform:uppercase;padding:7px 14px;border-radius:999px}
.hero h1{font-size:2rem;margin:14px 0 4px;line-height:1.1}
.hero p.sub{margin:0;color:var(--gris);font-weight:600}
.curva-hero{width:100%;height:120px;display:block;margin:6px 0 2px}
.campo{text-align:left;margin-top:14px}
.campo label{display:block;font-weight:800;font-size:.92rem;margin-bottom:6px}
.campo input,.campo select{width:100%;padding:15px 16px;border-radius:16px;border:2px solid var(--linea);background:var(--papel);font-weight:700}
.campo input:focus,.campo select:focus{border-color:var(--violeta);background:var(--blanco)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px 20px;border-radius:18px;background:var(--violeta);color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 7px 0 var(--violeta-osc);transition:transform .12s,box-shadow .12s;margin-top:14px}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--violeta-osc)}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.verde{background:var(--verde);box-shadow:0 7px 0 #0A8552}
.btn.gris{background:var(--blanco);color:var(--tinta);box-shadow:0 0 0 2px var(--linea) inset;font-weight:700}

/* ---------- BARRA ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:2px solid var(--linea);padding:9px 12px 10px;padding-top:calc(9px + env(safe-area-inset-top,0px))}
.topbar .fila{display:flex;align-items:center;gap:10px;max-width:1160px;margin:0 auto}
.avatar{width:38px;height:38px;border-radius:13px;background:var(--violeta);color:#fff;display:grid;place-items:center;font-family:'Fredoka';font-size:1.05rem;flex:0 0 auto}
.quien{min-width:0;flex:1}
.quien b{display:block;font-size:.98rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien span{font-size:.78rem;color:var(--gris);font-weight:700}
.casa{width:42px;height:42px;border-radius:14px;background:var(--violeta-luz);display:grid;place-items:center;font-size:1.15rem;flex:0 0 auto}
.casa:active{transform:scale(.92)}
.chips{display:flex;gap:7px;max-width:1160px;margin:8px auto 0;overflow:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:800;font-size:.86rem;background:var(--violeta-luz);color:var(--violeta-osc);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.ok{background:var(--verde-luz);color:#0A7A4C}
.chip.mal{background:var(--rojo-luz);color:#C3103C}
.chip.reloj{background:var(--cian-luz);color:#0B7E96}
.chip.pop{animation:pop .35s ease}
main{padding:calc(var(--barra) + 14px) 14px 40px;max-width:1160px;margin:0 auto}
.vista{animation:entra .3s ease both}

/* ---------- MENÚ ---------- */
.saludo{background:linear-gradient(140deg,var(--violeta),#8A5CF6 60%,var(--cian));color:#fff;border-radius:26px;padding:20px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.saludo h2{margin:0 0 4px;font-size:1.5rem}
.saludo p{margin:0;opacity:.93;font-weight:600;font-size:.95rem;max-width:36ch}
.saludo svg{position:absolute;right:-12px;bottom:-14px;width:150px;opacity:.32}
.mini{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mini div{background:rgba(255,255,255,.2);border-radius:14px;padding:7px 12px;font-weight:800;font-size:.85rem}
.titulo-sec{font-family:'Fredoka';font-size:1.12rem;margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.titulo-sec i{font-style:normal;color:var(--gris);font-family:'Nunito';font-weight:700;font-size:.85rem}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.card{background:var(--blanco);border-radius:var(--r);padding:16px;box-shadow:var(--sombra-sm);display:flex;gap:14px;align-items:center;text-align:left;width:100%;transition:transform .14s,box-shadow .14s;border:2px solid transparent}
.card:active{transform:scale(.985)}
.card:hover{box-shadow:var(--sombra);border-color:var(--violeta-luz)}
.ico{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:1.5rem;flex:0 0 auto;background:var(--violeta-luz)}
.ico{position:relative}
.nlec{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;background:var(--violeta);color:#fff;font-family:'Nunito';font-weight:800;font-size:.74rem;display:grid;place-items:center;box-shadow:0 2px 6px rgba(27,21,68,.25)}
.ico.c-cian{background:var(--cian-luz)}.ico.c-verde{background:var(--verde-luz)}.ico.c-ambar{background:var(--ambar-luz)}.ico.c-rojo{background:var(--rojo-luz)}
.card .txt{flex:1;min-width:0}
.card .txt b{font-family:'Fredoka';font-weight:600;font-size:1.05rem;display:block}
.card .txt small{color:var(--gris);font-weight:600;font-size:.85rem;display:block;line-height:1.3}
.pill{font-size:.75rem;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--papel);color:var(--gris);white-space:nowrap}
.pill.hecho{background:var(--verde-luz);color:#0A7A4C}
.pill.curso{background:var(--ambar-luz);color:#8A5A00}
.card.lab{background:linear-gradient(135deg,#0C2C4A,#16506E);color:#fff}
.card.lab .txt small{color:#BEE7F3}
.card.lab .ico{background:rgba(255,255,255,.16)}

/* ---------- PANELES ---------- */
.panel{background:var(--blanco);border-radius:var(--r);box-shadow:var(--sombra-sm);padding:16px;margin-bottom:12px}
.cab-lec{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cab-lec .ico{width:46px;height:46px;font-size:1.3rem;border-radius:15px}
.cab-lec h2{margin:0;font-size:1.2rem;line-height:1.15}
.cab-lec small{color:var(--gris);font-weight:700;font-size:.83rem}
.eq{background:var(--papel);border:2px solid var(--linea);border-radius:16px;padding:13px 12px;text-align:center;font-size:1.35rem;font-weight:800;font-family:'Fredoka';overflow-x:auto}
.eq.chico{font-size:1.08rem;padding:10px}
.formula{background:var(--violeta-luz);color:var(--violeta-osc);border-radius:14px;padding:12px 14px;font-weight:800;text-align:center;font-size:1.15rem;margin:10px 0;overflow-x:auto}
.lienzo{background:var(--blanco);border-radius:18px;border:2px solid var(--linea);overflow:hidden}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.leyenda{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;font-size:.79rem;font-weight:700;color:var(--gris)}
.leyenda span{display:inline-flex;align-items:center;gap:5px;opacity:.35;transition:opacity .3s}
.leyenda span.on{opacity:1}
.punto-l{width:11px;height:11px;border-radius:50%;display:inline-block}

/* ---------- TEORÍA ---------- */
.teoria-caja{max-width:640px;margin:0 auto}
.puntos{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}
.puntos i{width:9px;height:9px;border-radius:50%;background:var(--linea);transition:.25s}
.puntos i.on{background:var(--violeta);width:26px;border-radius:99px}
.lamina h3{margin:0 0 4px;font-size:1.25rem}
.lamina .et{display:inline-block;background:var(--ambar-luz);color:#8A5A00;font-weight:800;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;padding:5px 11px;border-radius:999px;margin-bottom:8px}
.lamina p{margin:0 0 9px;font-size:.98rem}
.lamina ul{margin:0 0 9px;padding-left:20px}
.lamina li{margin-bottom:5px;font-size:.97rem}
.ejemplo{background:var(--verde-luz);border-radius:16px;padding:12px 14px;font-weight:700;font-size:.95rem;margin:10px 0}
.ejemplo b{color:#0A7A4C}
.dosbtn{display:flex;gap:10px}
.dosbtn .btn{margin-top:14px}

/* ---------- PROCEDIMIENTO ---------- */
.camino{padding:14px 10px 6px}
.camino .cabecera{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 4px;font-weight:800;font-size:.86rem;color:var(--gris)}
.camino b{color:var(--violeta-osc);font-size:1rem}
.ruta{list-style:none;margin:0;padding:0}
.ruta li{display:flex;gap:11px;align-items:flex-start;padding:7px 0;font-weight:700;font-size:.93rem;color:var(--gris)}
.ruta li .n{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--linea);color:#fff}
.ruta li.hecho{color:var(--tinta)}
.ruta li.hecho .n{background:var(--verde)}
.ruta li.activo{color:var(--violeta-osc)}
.ruta li.activo .n{background:var(--violeta);animation:late 1.6s ease-in-out infinite}
.bitacora{border-left:3px solid var(--verde);padding-left:12px;margin:0 0 12px}
.bitacora.vacia{border-left:0;padding:0}
.bit-tit{font-weight:800;font-size:.83rem;color:#0A7A4C;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.bit{background:var(--verde-luz);border-radius:14px;padding:11px 13px;margin-bottom:8px;font-size:.93rem;font-weight:700;animation:entra .35s ease both}
.bit .tt{display:flex;align-items:center;gap:7px;font-weight:800;color:#0A7A4C;font-size:.83rem;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.bit .cuenta{background:rgba(255,255,255,.75);border-radius:10px;padding:8px 10px;margin-top:6px;text-align:center;font-size:1.02rem;overflow-x:auto}

/* ---------- PASO ---------- */
.paso-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.paso-cab .nn{background:var(--violeta);color:#fff;font-weight:800;font-size:.78rem;padding:5px 11px;border-radius:999px;letter-spacing:.5px}
.paso h3{margin:0 0 6px;font-size:1.1rem}
.paso p.dice{margin:0 0 10px;font-weight:700;font-size:.98rem}
.sustit{background:var(--papel);border:2px dashed var(--linea);border-radius:14px;padding:12px;text-align:center;font-size:1.1rem;font-weight:800;margin:10px 0;overflow-x:auto}
.grupo-num{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.casilla{flex:1 1 90px;min-width:92px}
.casilla span{display:block;font-weight:800;font-size:.86rem;margin-bottom:5px;color:var(--gris)}
.entrada{position:relative}
.casilla input{width:100%;height:60px;padding-right:44px;text-align:center;font-size:1.4rem;font-weight:800;font-family:'Fredoka';border-radius:16px;border:2.5px solid var(--linea);background:var(--papel)}
.casilla input:focus{border-color:var(--violeta);background:var(--blanco)}
.casilla input.malo{border-color:var(--rojo);background:var(--rojo-luz);animation:tiembla .4s}
.casilla input.bueno{border-color:var(--verde);background:var(--verde-luz)}
.signo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:11px;background:var(--violeta-luz);color:var(--violeta-osc);font-weight:800;font-size:1.05rem}
.signo:active{transform:translateY(-50%) scale(.9)}
.fracbox{margin:12px auto 0;max-width:250px}
.fracbox .lbl{text-align:center;font-weight:800;font-size:.86rem;color:var(--gris);margin-bottom:6px}
.fracbox .barra{height:4px;background:var(--tinta);border-radius:99px;margin:8px 0}
.fracbox .entrada input{padding-right:44px}
.fracbox input{width:100%;height:58px;text-align:center;font-size:1.4rem;font-weight:800;font-family:'Fredoka';border-radius:14px;border:2.5px solid var(--linea);background:var(--papel)}
.fracbox input.malo{border-color:var(--rojo);background:var(--rojo-luz);animation:tiembla .4s}
.fracbox input.bueno{border-color:var(--verde);background:var(--verde-luz)}
.opciones{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opcion{display:flex;align-items:center;gap:11px;padding:14px 15px;border-radius:16px;border:2.5px solid var(--linea);background:var(--papel);font-weight:700;text-align:left;width:100%;transition:.12s}
.opcion[aria-pressed="true"]{border-color:var(--violeta);background:var(--violeta-luz);color:var(--violeta-osc)}
.opcion.malo{border-color:var(--rojo);background:var(--rojo-luz);animation:tiembla .4s}
.tip{font-size:.82rem;color:#8880B8;font-weight:700;margin:10px 0 0;text-align:center}
.acciones{display:flex;gap:10px;margin-top:12px}
.acciones .btn{margin-top:0}
.acciones .btn.gris{flex:0 0 40%}
.acierto{text-align:center;border:2.5px solid var(--verde);animation:entra .3s ease both}
.acierto .sello{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;margin:0 auto 10px;background:var(--verde-luz);color:var(--verde);animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both}
.acierto h3{margin:0 0 4px;font-size:1.25rem}
.cuenta-ok{background:var(--papel);border-radius:14px;padding:11px 12px;margin:10px 0;font-size:1.05rem;font-weight:800;overflow-x:auto}
.expl-ok{margin:0 0 12px;font-weight:700;font-size:.96rem;text-align:left}
.rev-graf,.rev-datos{background:var(--papel);border-radius:16px;padding:12px;margin-bottom:10px;text-align:left}
.rev-tit{font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);margin-bottom:8px}
.rev-datos ul{margin:0;padding-left:18px}
.rev-datos li{font-weight:700;font-size:.95rem;margin-bottom:4px}
.rev-graf .lienzo{background:var(--blanco)}

/* ---------- LAB ---------- */
.slider-fila{display:flex;align-items:center;gap:12px;margin:14px 0}
.slider-fila label{width:104px;flex:0 0 auto;font-weight:800;font-size:.95rem}
.slider-fila label em{font-style:italic;color:var(--violeta);font-size:1.15rem}
.slider-fila output{min-width:54px;text-align:center;font-weight:800;font-family:'Fredoka';background:var(--violeta-luz);color:var(--violeta-osc);border-radius:11px;padding:5px 7px;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:10px;border-radius:99px;background:var(--linea);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--violeta);border:4px solid #fff;box-shadow:0 3px 8px rgba(27,21,68,.3)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--violeta);border:4px solid #fff}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.dato{background:var(--papel);border-radius:15px;padding:10px 12px}
.dato small{display:block;color:var(--gris);font-weight:800;font-size:.74rem;text-transform:uppercase;letter-spacing:.6px}
.dato b{font-family:'Fredoka';font-size:1.05rem;font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg{padding:9px 13px;border-radius:999px;border:2px solid var(--linea);font-weight:800;font-size:.85rem;background:var(--blanco)}
.tg[aria-pressed="true"]{background:var(--violeta);border-color:var(--violeta);color:#fff}
.preset{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.preset button{padding:9px 12px;border-radius:13px;background:var(--cian-luz);color:#0B7E96;font-weight:800;font-size:.83rem}

/* ---------- MODALES ---------- */
.capa{position:fixed;inset:0;z-index:90;background:rgba(27,21,68,.55);backdrop-filter:blur(3px);display:grid;place-items:end center;padding:16px;animation:fade .2s ease both}
@media(min-width:700px){.capa{place-items:center}}
.modal{background:var(--blanco);border-radius:28px;padding:22px 20px 20px;width:100%;max-width:480px;animation:sube .3s cubic-bezier(.2,.9,.3,1.2) both;text-align:center;max-height:88dvh;overflow:auto}
.modal .sello{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;margin:0 auto 12px;animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both}
.sello.mal{background:var(--rojo-luz);color:var(--rojo)}
.sello.fiesta{background:var(--ambar-luz)}
.modal h3{margin:0 0 6px;font-size:1.3rem}
.modal p{margin:0 0 4px;color:var(--gris);font-weight:600}
.modal .porque{background:var(--papel);border-radius:16px;padding:12px 14px;margin-top:12px;font-weight:700;color:var(--tinta);font-size:.95rem;text-align:left}
.modal .porque b{color:var(--violeta-osc)}
.resumen{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 4px;text-align:left}
.resumen div{background:var(--papel);border-radius:15px;padding:10px 12px}
.resumen small{display:block;color:var(--gris);font-weight:800;font-size:.74rem;text-transform:uppercase;letter-spacing:.5px}
.resumen b{font-family:'Fredoka';font-size:1.1rem;font-weight:600}
.btn.ambar{background:var(--ambar);color:#4A2E00;box-shadow:0 7px 0 #D68B00}
.hoja{max-width:640px;text-align:left;padding:18px 16px 16px}
.hoja-cab h3{margin:0;font-size:1.2rem}
.hoja-meta{margin:2px 0 0;font-size:.85rem;color:var(--gris);font-weight:700}
.hoja-cuerpo{margin-top:12px}
.hoja-et{display:block;font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.9px;color:var(--gris);margin:14px 0 6px}
.hoja-enun{background:var(--papel);border-radius:14px;padding:10px 12px;font-weight:800;font-size:1.12rem;text-align:center}
.hoja-enun .hoja-et{text-align:left}
.hoja-pasos{margin:0;padding-left:20px}
.hoja-pasos li{margin-bottom:12px;font-size:.94rem;font-weight:700}

@keyframes sube{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes tiembla{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes sello{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}

@media(min-width:900px){
  body{font-size:18px}
  .grid{grid-template-columns:1fr 1fr}

  .datos{grid-template-columns:1fr 1fr 1fr}
  .dos-col:not(.sin-graf) .rev-graf{display:none}
  main{padding-left:20px;padding-right:20px}
}

<script>
"use strict";
/* ===================== ESTADO ===================== */
const META = 12;
function metaDe(l){ return (l && l.meta) || META; }
function numLec(l){ const i = LECCIONES.filter(x=>x.gen).indexOf(l); return i<0?0:i+1; }
const S = {nombre:"",grado:"",ok:0,mal:0,t0:0,tick:null,prog:{},lecc:null,ej:null,paso:0,resp:{},log:[],graf:null,cv:null,racha:0,bloq:false};

/* ===================== NÚMEROS Y FRACCIONES ===================== */
const $ = s => document.querySelector(s);
const ri = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const casi = (x,y) => Math.abs(x-y) < 1e-6;
const gcd = (a,b) => b ? gcd(b, a%b) : Math.abs(a);

function fmt(n){
  n = Math.round(n*1e6)/1e6;
  if(Number.isInteger(n)) return String(n).replace("-","−");
  return String(Math.round(n*1000)/1000).replace(".",",").replace("-","−");
}
function parseNum(t){
  if(t==null) return NaN;
  let s = String(t).trim().replace(/−/g,"-").replace(/\s/g,"").replace(",",".");
  if(s==="" || s==="-") return NaN;
  if(s.includes("/")){
    const p = s.split("/"); if(p.length!==2) return NaN;
    const a=Number(p[0]), b=Number(p[1]);
    if(!isFinite(a)||!isFinite(b)||b===0) return NaN;
    return a/b;
  }
  const v = Number(s); return isFinite(v)?v:NaN;
}
function aFrac(v){
  if(Number.isInteger(v)) return null;
  const s = v<0?-1:1, x = Math.abs(v);
  for(let d=2; d<=48; d++){
    const n = x*d;
    if(Math.abs(n-Math.round(n))<1e-9){ const g = gcd(Math.round(n),d)||1; return {n:s*Math.round(n)/g, d:d/g}; }
  }
  return null;
}
/* fracción visual */
function fr(n,d){ return `<span class="fr"><b>${typeof n==="number"?fmt(n):n}</b><u>${typeof d==="number"?fmt(d):d}</u></span>`; }
/* número: entero, fracción visual o decimal */
function N(v){ const f = aFrac(v); return f ? fr(f.n,f.d) : fmt(v); }
function Nlisto(v){ const f = aFrac(v); return f ? fmt(f.n)+"/"+fmt(f.d) : fmt(v); }
function raiz(x){ return `<span class="rad"><em>√</em><u>${x}</u></span>`; }
function par(x,y){ return "(" + fmt(x) + ", " + fmt(y) + ")"; }
function parN(x,y){ return "(" + N(x) + ", " + N(y) + ")"; }
function neg(v){ return v<0 ? "("+fmt(v)+")" : fmt(v); }

function term(coef,v,primero){
  if(coef===0) return "";
  const abs = Math.abs(coef);
  const num = (abs===1 && v) ? "" : fmt(abs).replace("−","");
  const cuerpo = num + v;
  return primero ? (coef<0?"−":"")+cuerpo : (coef<0?" − ":" + ")+cuerpo;
}
function eqHTML(a,b,c,izq="f(<i class='v'>x</i>) = "){
  const t = [[a,"<i class='v'>x</i>²"],[b,"<i class='v'>x</i>"],[c,""]].filter(p=>p[0]!==0);
  if(!t.length) return izq+"0";
  let s = term(t[0][0],t[0][1],true);
  for(let i=1;i<t.length;i++) s += term(t[i][0],t[i][1],false);
  return izq+s;
}
function eqDesordenada(a,b,c){
  const t = shuffle([[a,"<i class='v'>x</i>²"],[b,"<i class='v'>x</i>"],[c,""]].filter(p=>p[0]!==0));
  let s = term(t[0][0],t[0][1],true);
  for(let i=1;i<t.length;i++) s += term(t[i][0],t[i][1],false);
  return "f(<i class='v'>x</i>) = "+s;
}

/* ===================== GRÁFICA ===================== */
function montarGrafica(cont,opt){
  const cv = document.createElement("canvas");
  cont.appendChild(cv); cv._opt = opt; redibujar(cv);
  if(!montarGrafica._obs) montarGrafica._obs = new ResizeObserver(es=>es.forEach(e=>{
    const c = e.target.querySelector("canvas"); if(c) redibujar(c);
  }));
  montarGrafica._obs.observe(cont);
  return cv;
}
function redibujar(cv,nuevo){
  if(nuevo) Object.assign(cv._opt,nuevo);
  const o = cv._opt, cont = cv.parentElement;
  const dpr = Math.min(window.devicePixelRatio||1,2.5);
  const W = Math.max(240,cont.clientWidth), H = Math.round(Math.min(Math.max(W*.8,250),350));
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+"px";
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  if(o.boceto){ return dibujarBoceto(g,W,H,o); }
  const {a,b,c} = o, h = -b/(2*a), k = a*h*h+b*h+c;
  let xmin = Math.min(h-5.5,-1.5), xmax = Math.max(h+5.5,1.5);
  (o.puntos||[]).forEach(p=>{ xmin=Math.min(xmin,p[0]-1.5); xmax=Math.max(xmax,p[0]+1.5); });
  const ys=[]; for(let i=0;i<=40;i++){ const x=xmin+(xmax-xmin)*i/40; ys.push(a*x*x+b*x+c); }
  const fin = ys.filter(v=>Math.abs(v)<200);
  let ymin = Math.min(0,k,...fin), ymax = Math.max(0,k,...fin);
  if(ymax-ymin<6){ const m=(ymax+ymin)/2; ymin=m-3; ymax=m+3; }
  const pad=(ymax-ymin)*.12; ymin-=pad; ymax+=pad;
  if(ymax-ymin>26){ if(a>0){ymin=k-2;ymax=k+24;} else {ymax=k+2;ymin=k-24;} }
  const X = x => (x-xmin)/(xmax-xmin)*W, Y = y => H-(y-ymin)/(ymax-ymin)*H;
  const px = paso(xmax-xmin), py = paso(ymax-ymin);
  g.lineWidth=1; g.strokeStyle="#EDEAFB";
  for(let x=Math.ceil(xmin/px)*px;x<=xmax;x+=px){g.beginPath();g.moveTo(X(x),0);g.lineTo(X(x),H);g.stroke();}
  for(let y=Math.ceil(ymin/py)*py;y<=ymax;y+=py){g.beginPath();g.moveTo(0,Y(y));g.lineTo(W,Y(y));g.stroke();}
  g.strokeStyle="#B9B2E0"; g.lineWidth=2.2;
  g.beginPath();g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
  g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.stroke();
  g.fillStyle="#8880B8"; g.font="600 11px Nunito,sans-serif"; g.textAlign="center";
  for(let x=Math.ceil(xmin/px)*px;x<=xmax;x+=px){ if(Math.abs(x)<1e-9) continue;
    g.fillText(fmt(x),X(x),Math.min(Math.max(Y(0)+13,12),H-3)); }
  g.textAlign="right";
  if(!o.sinNumerosY) for(let y=Math.ceil(ymin/py)*py;y<=ymax;y+=py){ if(Math.abs(y)<1e-9) continue;
    g.fillText(fmt(y),Math.min(Math.max(X(0)-6,22),W-3),Y(y)+4); }
  g.textAlign="left"; g.fillStyle="#6C6790"; g.font="italic 700 13px Nunito,sans-serif";
  g.fillText("x",W-14,Y(0)-8); g.fillText("y",X(0)+8,14);

  if(o.eje){ g.save();g.strokeStyle="#12B4D8";g.lineWidth=2.4;g.setLineDash([7,6]);
    g.beginPath();g.moveTo(X(h),0);g.lineTo(X(h),H);g.stroke();
    g.setLineDash([]);g.fillStyle="#0B7E96";g.font="800 12px Nunito,sans-serif";g.textAlign="center";
    g.fillText("x = "+Nlisto(h),X(h),14); g.restore(); }
  if(o.directriz){ const p=1/(4*a); g.save();g.strokeStyle="#FFB020";g.lineWidth=2.4;g.setLineDash([5,6]);
    g.beginPath();g.moveTo(0,Y(k-p));g.lineTo(W,Y(k-p));g.stroke(); g.restore(); }
  if(o.curva){
    g.strokeStyle="#5B3DF5";g.lineWidth=4;g.lineJoin="round";g.lineCap="round";g.beginPath();
    let on=false;
    for(let p=0;p<=W;p+=2){ const x=xmin+(xmax-xmin)*p/W, y=a*x*x+b*x+c, yy=Y(y);
      if(yy<-400||yy>H+400){on=false;continue;}
      if(!on){g.moveTo(p,yy);on=true;} else g.lineTo(p,yy); }
    g.stroke();
  }
  if(o.raices){ const d=b*b-4*a*c;
    if(d>=0){ const r1=(-b-Math.sqrt(d))/(2*a), r2=(-b+Math.sqrt(d))/(2*a);
      [r1,r2].forEach(r=>punto(g,X(r),Y(0),"#0FA968",Nlisto(Math.round(r*1e6)/1e6),6,1)); } }
  if(o.cortey) punto(g,X(0),Y(c),"#12B4D8","(0, "+fmt(c)+")",6,-1);
  (o.puntos||[]).forEach(p=>punto(g,X(p[0]),Y(p[1]),"#0FA968",par(p[0],p[1]),6,-1));
  if(o.verticeQ){
    const yy = Y(k), dir = yy>H-34?-1:1;
    g.beginPath(); g.arc(X(h),yy,8,0,7); g.fillStyle="#fff"; g.fill();
    g.lineWidth=3.5; g.strokeStyle="#F0436A"; g.stroke();
    g.fillStyle="#F0436A"; g.font="800 12px Nunito,sans-serif"; g.textAlign="center";
    const txt = "V ("+Nlisto(h)+", ?)", w = g.measureText(txt).width+12, ty = yy+(dir===-1?-18:24);
    g.fillStyle="rgba(255,255,255,.92)"; g.beginPath(); g.roundRect(X(h)-w/2,ty-12,w,19,9); g.fill();
    g.fillStyle="#F0436A"; g.fillText(txt,X(h),ty+2);
  }
  if(o.vertice) punto(g,X(h),Y(k),"#F0436A","V "+parLisTo(h,k),8,Y(k)>H-34?-1:1);
  if(o.foco){ const p=1/(4*a); punto(g,X(h),Y(k+p),"#FFB020","F",7,-1); }
}
function dibujarBoceto(g,W,H,o){
  g.strokeStyle="#EDEAFB"; g.lineWidth=1;
  for(let x=0;x<=W;x+=26){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  for(let y=0;y<=H;y+=26){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  const cx = W*0.44, cy = H*0.52, vx = cx + W*0.14;
  g.strokeStyle="#B9B2E0"; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(0,cy); g.lineTo(W,cy); g.stroke();
  g.beginPath(); g.moveTo(cx,0); g.lineTo(cx,H); g.stroke();
  g.fillStyle="#8880B8"; g.font="italic 700 13px Nunito,sans-serif"; g.textAlign="left";
  g.fillText("x",W-14,cy-8); g.fillText("y",cx+8,14);
  g.font="800 10.5px Nunito,sans-serif"; g.fillStyle="#C3BCE6"; g.textAlign="left";
  g.fillText("BOCETO · TODAVÍA SIN VALORES EXACTOS",10,15);
  if(!o.forma){
    g.fillStyle="#B9B2E0"; g.font="800 15px Nunito,sans-serif"; g.textAlign="center";
    g.fillText("¿Hacia dónde abrirá?",W/2,cy-24);
    g.font="800 34px Nunito,sans-serif"; g.fillText("?",W/2,cy+22);
    return;
  }
  const arriba = o.forma==="arriba";
  const vy = arriba ? H*0.80 : H*0.20;
  const cf = (arriba?1:-1)*(H*0.62)/Math.pow(W*0.40,2);
  g.strokeStyle="#5B3DF5"; g.lineWidth=4; g.lineCap="round"; g.lineJoin="round";
  g.beginPath(); let on=false;
  for(let x=W*0.05;x<=W*0.95;x+=3){
    const y = vy + cf*Math.pow(x-vx,2);
    if(y<3||y>H-3){ on=false; continue; }
    if(!on){ g.moveTo(x,y); on=true; } else g.lineTo(x,y);
  }
  g.stroke();
  if(o.ejeQ){
    g.save(); g.strokeStyle="#12B4D8"; g.lineWidth=2.4; g.setLineDash([7,6]);
    g.beginPath(); g.moveTo(vx,0); g.lineTo(vx,H); g.stroke(); g.setLineDash([]);
    g.fillStyle="#0B7E96"; g.font="800 13px Nunito,sans-serif"; g.textAlign="center";
    g.fillText("x = ?",vx,16); g.restore();
  }
  g.beginPath(); g.arc(vx,vy,7,0,7); g.fillStyle="#fff"; g.fill();
  g.lineWidth=3.5; g.strokeStyle="#F0436A"; g.stroke();
  g.fillStyle="#F0436A"; g.font="800 12px Nunito,sans-serif"; g.textAlign="center";
  g.fillText("V (?, ?)", vx, arriba? vy+24 : vy-14);
}
function parLisTo(x,y){ return "("+Nlisto(x)+", "+Nlisto(y)+")"; }
function paso(span){
  const bruto = span/9, exp = Math.pow(10,Math.floor(Math.log10(bruto))), n = bruto/exp;
  return (n<1.5?1:n<3?2:n<7?5:10)*exp;
}
function punto(g,x,y,col,txt,r,dir){
  g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=col;g.fill();g.lineWidth=3;g.strokeStyle="#fff";g.stroke();
  if(txt){ g.font="800 12px Nunito,sans-serif";g.textAlign="center";
    const w=g.measureText(txt).width+12, ty=y+(dir===-1?-16:22);
    g.fillStyle="rgba(255,255,255,.92)";g.beginPath();g.roundRect(x-w/2,ty-12,w,19,9);g.fill();
    g.fillStyle=col;g.fillText(txt,x,ty+2); }
}
if(typeof CanvasRenderingContext2D!=="undefined" && !CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};
}

/* ===================== GENERADORES PASO A PASO =====================
   Cada ejercicio: {a,b,c, titulo, encabezado, pasos:[...]}
   Cada paso: {titulo, corto, dice, formula, sustit, tipo, campos|opciones, pista, explica, cuenta, revela}
==================================================================== */

/* --- 1. Concavidad --- */
function ejConcavidad(){
  const a = pick([1,2,3,4,-1,-2,-3,-4,0.5,-0.5]), b = ri(-6,6), c = ri(-8,8);
  const arriba = a>0;
  return {a,b,c, titulo:"Del signo de a a la forma de la parábola",
    encabezado: eqHTML(a,b,c),
    pasos:[
      {corto:"Leer el coeficiente a", titulo:"Paso 1 · Ubica el coeficiente a",
       dice:"En la forma general, <b>a</b> es el número que multiplica a <i class='v'>x</i>². Escríbelo con su signo.",
       formula:"f(<i class='v'>x</i>) = <b>a</b><i class='v'>x</i>² + b<i class='v'>x</i> + c",
       tipo:"num", campos:[{id:"a",et:"a =",val:a}],
       pista:"Mira solo el término con <i class='v'>x</i>². Si aparece <i class='v'>x</i>² sin número, entonces a = 1; si aparece −<i class='v'>x</i>², entonces a = −1.",
       explica:()=>`El término con <i class='v'>x</i>² es ${term(a,"<i class='v'>x</i>²",true)}, así que <b>a = ${fmt(a)}</b>.`},
      {corto:"Signo de a", titulo:"Paso 2 · ¿Qué signo tiene?",
       dice:"El signo de a es el que decide todo lo demás.",
       tipo:"opcion", opciones:[{v:"pos",txt:"➕ a es positivo (a &gt; 0)"},{v:"neg",txt:"➖ a es negativo (a &lt; 0)"}],
       correcta: arriba?"pos":"neg",
       pista:"Si el número lleva un menos delante, es negativo. Si no lleva signo, es positivo.",
       explica:()=>`a = ${fmt(a)} es un número <b>${arriba?"positivo":"negativo"}</b>.`},

/* --- 3. Eje de simetría --- */
function ejEje(){
  const d = pick([1,1,2,2,3,4]);
  const m = pick([1,-1,2,-2,3]);
  const a = m*d;
  let n = ri(-5,5); if(n===0) n = 2;
  while(gcd(Math.abs(n),d)!==1) n = n>0?n+1:n-1;
  const h = n/d, b = -2*a*h, c = ri(-6,6);
  const exacta = Number.isInteger(h);
  return {a,b,c, titulo:"Eje de simetría con x = −b/(2a)",
    encabezado: eqHTML(a,b,c),
    pasos:[
      {corto:"Identificar a y b", titulo:"Paso 1 · Toma los datos que necesitas",
       dice:"La fórmula del eje solo usa <b>a</b> y <b>b</b>. Escríbelos con su signo.",
       formula:"x = "+fr("− b","2a"),
       tipo:"num", campos:[{id:"a",et:"a =",val:a},{id:"b",et:"b =",val:b}],
       pista:"a acompaña a <i class='v'>x</i>² y b acompaña a <i class='v'>x</i>. No olvides los signos.",
       explica:()=>`De ${eqHTML(a,b,c)} tomamos <b>a = ${fmt(a)}</b> y <b>b = ${fmt(b)}</b>.`},
      {corto:"Calcular el numerador", titulo:"Paso 2 · Arriba va −b",
       dice:"El numerador es <b>−b</b>: cambia el signo de b.",
       sustit:()=>`− b = − (${fmt(b)}) = <b>${fmt(-b)}</b>`,
       tipo:"num", campos:[{id:"n1",et:"− b =",val:-b}],
       pista: b<0 ? "b es negativo, y menos por menos da <b>más</b>." : "b es positivo, así que −b queda negativo.",
       explica:()=>`Numerador listo: <b>${fmt(-b)}</b>.`},
      {corto:"Calcular el denominador", titulo:"Paso 3 · Abajo va 2a",
       dice:"El denominador es <b>2·a</b>. Multiplica, no sumes.",
       sustit:()=>`2a = 2 · ${neg(a)} = <b>${fmt(2*a)}</b>`,
       tipo:"num", campos:[{id:"d1",et:"2a =",val:2*a}],
       pista:"Solo multiplica el 2 por el valor de a que ya encontraste.",
       explica:()=>`Denominador listo: <b>${fmt(2*a)}</b>.`},
      {corto:"Escribir el eje como fracción", titulo:"Paso 4 · Arma la fracción",
       dice:"Coloca los dos valores en su lugar: <b>−b</b> arriba y <b>2a</b> abajo. Así queda expresado el eje de simetría.",
       sustit:()=>`x = ${fr("− ("+fmt(b)+")","2 · "+neg(a))} = ${fr(-b,2*a)}${exacta?" = <b>"+fmt(h)+"</b>":" = <b>"+N(h)+"</b> ya simplificada"}`,
       tipo:"frac", campos:[{id:"n",et:"numerador",val:-b},{id:"d",et:"denominador",val:2*a}],
       pista:"Arriba escribe el resultado de −b y abajo el de 2a, tal como los calculaste en los pasos anteriores.",
       explica:()=>`El eje de simetría es <b>x = ${fr(-b,2*a)}</b>, que simplificada queda <b>x = ${N(h)}</b>. Esa recta vertical parte la parábola en dos mitades iguales.`,
       cuenta:()=>`Eje de simetría: <b>x = ${N(h)}</b>`,
       revela:{curva:true,eje:true}}
    ]};
}

/* --- 4. Vértice --- */
function ejVertice(){

  const dd = mitad?2:1, m = pick([1,2,3,-1,-2,-3]);

  const h = mitad ? n/2 : n;
  const b = -2*a*h, c = ri(-6,6), k = a*h*h+b*h+c;
  return {a,b,c, meta:12, titulo:"El vértice V(h, k) construido paso a paso",
    encabezado: eqHTML(a,b,c),
    pasos:[
      {corto:"Identificar a, b y c", titulo:"Paso 1 · Empieza por los coeficientes",
       dice:"Antes de reemplazar en ninguna fórmula, escribe los tres coeficientes con su signo.",
       formula:"f(<i class='v'>x</i>) = a<i class='v'>x</i>² + b<i class='v'>x</i> + c",
       tipo:"num", campos:[{id:"a",et:"a =",val:a},{id:"b",et:"b =",val:b},{id:"c",et:"c =",val:c}],
       pista:"a va con <i class='v'>x</i>², b va con <i class='v'>x</i> y c va solo. Si algún término no aparece, ese coeficiente es 0.",

      {corto:"Armar la fracción −b/(2a)", titulo:"Paso 2 · Reemplaza en la fórmula de h",
       dice:"Todavía no dividas. Primero coloca cada valor en su lugar dentro de la fracción.",
       formula:"h = "+fr("− b","2a"),
       sustit:()=>`h = ${fr("− ("+fmt(b)+")","2 · "+neg(a))} = ${fr(-b,2*a)}`,
       tipo:"frac", campos:[{id:"n",et:"numerador (− b)",val:-b},{id:"d",et:"denominador (2a)",val:2*a}],
       pista:"Arriba va −b, es decir el signo de b cambiado. Abajo va 2 multiplicado por a.",
       explica:()=>`La fracción queda ${fr(-b,2*a)}.`},
      {corto:"Resolver y obtener h", titulo:"Paso 3 · Ahora sí, resuelve la fracción",
       dice:"Divide o simplifica la fracción del paso anterior. Si no da entero, se deja como fracción.",
       sustit:()=>`h = ${fr(-b,2*a)} = <b>${N(h)}</b>`,

       explica:()=>`h = <b>${N(h)}</b>. Esa es la x del vértice y también el eje de simetría.`,
       cuenta:()=>`h = <b>${N(h)}</b>`,
       revela:{eje:true}},
      {corto:"Calcular a·h²", titulo:"Paso 4 · Primer pedazo: a·h²",
       dice:"Ya tienes h. Reemplázala en la función por partes: primero eleva h al cuadrado y multiplica por a.",
       sustit:()=>`a · h² = ${neg(a)} · (${N(h)})² = ${neg(a)} · ${N(h*h)} = <b>${N(a*h*h)}</b>`,
       tipo:"num", campos:[{id:"t1",et:"a · h² =",val:a*h*h}],
       pista:"Primero el cuadrado y después la multiplicación. El cuadrado de un negativo siempre da positivo.",
       explica:()=>`a·h² = <b>${N(a*h*h)}</b>.`},
      {corto:"Calcular b·h", titulo:"Paso 5 · Segundo pedazo: b·h",

       sustit:()=>`b · h = ${neg(b)} · ${N(h)} = <b>${N(b*h)}</b>`,
       tipo:"num", campos:[{id:"t2",et:"b · h =",val:b*h}],
       pista:"Cuidado con los signos: menos por menos da más.",
       explica:()=>`b·h = <b>${N(b*h)}</b>.`},
      {corto:"Sumar todo y hallar k", titulo:"Paso 6 · La y del vértice",
       dice:"Suma los dos pedazos y el término independiente c.",
       formula:"k = a·h² + b·h + c",
       sustit:()=>`k = ${N(a*h*h)} + (${N(b*h)}) + (${fmt(c)}) = <b>${N(k)}</b>`,
       tipo:"num", campos:[{id:"k",et:"k =",val:k}],
       pista:"Suma los tres valores respetando cada signo.",

/* --- 5. Foco y directriz --- */

  return {a,b,c, meta:10, titulo:"Foco y directriz desde la forma canónica",
    encabezado: canon,
    pasos:[
      {corto:"Leer el vértice", titulo:"Paso 1 · El vértice se lee directo",
       dice:"En la forma canónica f(x) = a(x − h)² + k, el vértice es <b>(h, k)</b>. Ojo con el signo: si dice (x + 2), entonces h = −2.",

       cuenta:()=>`Vértice: <b>${par(h,k)}</b>`,
       revela:{vertice:true,eje:true}},
      {corto:"Calcular 4a", titulo:"Paso 2 · El denominador de p",
       dice:"Antes de la fracción, resuelve la multiplicación de abajo: <b>4 · a</b>.",
       sustit:()=>`4a = 4 · ${neg(a)} = <b>${N(4*a)}</b>`,
       tipo:"num", campos:[{id:"d4",et:"4a =",val:4*a}],
       pista:"Multiplica 4 por el valor de a, con su signo. Si a es una fracción, el resultado puede ser entero.",
       explica:()=>`4a = <b>${N(4*a)}</b>.`},

       pista:"La x no cambia. Para la y, súmale p al valor de k.",
       explica:()=>`Foco <b>${parN(h,k+p)}</b>, siempre <b>dentro</b> de la parábola.`,
       cuenta:()=>`Foco: <b>${parN(h,k+p)}</b>`,

      {corto:"Trazar la directriz", titulo:"Paso 5 · La directriz y = k − p",

/* --- 6. Tabla de valores --- */
function ejTabla(){
  const a = pick([1,-1,2,-2]), b = ri(-3,3), c = ri(-4,4);
  const xs = shuffle([-2,-1,0,1,2]).slice(0,3).sort((u,v)=>u-v);
  const pasos = [];
  xs.forEach((x,i)=>{
    const t1 = a*x*x, t2 = b*x, y = t1+t2+c;
    pasos.push({
      corto:`Términos de x = ${fmt(x)}`, titulo:`Paso ${2*i+1} · Reemplaza x = ${fmt(x)} por partes`,
      dice:"No sumes todavía. Calcula primero cada término por separado, así no se enredan los signos.",
      sustit:()=>`a·x² = ${neg(a)}·(${fmt(x)})² = ${neg(a)}·${fmt(x*x)} = <b>${fmt(t1)}</b><br>b·x = ${neg(b)}·(${fmt(x)}) = <b>${fmt(t2)}</b>`,
      tipo:"num", campos:[{id:"t1",et:`a·(${fmt(x)})² =`,val:t1},{id:"t2",et:`b·(${fmt(x)}) =`,val:t2}],
      pista:`El cuadrado va primero: (${fmt(x)})² = ${fmt(x*x)}. Un número negativo elevado al cuadrado queda positivo.`,
      explica:()=>`a·x² = <b>${fmt(t1)}</b> y b·x = <b>${fmt(t2)}</b>.`});
    pasos.push({
      corto:`Obtener f(${fmt(x)})`, titulo:`Paso ${2*i+2} · Suma los tres términos`,
      dice:"Ahora sí, suma lo que calculaste más el término independiente c.",
      formula:`f(${fmt(x)}) = a·x² + b·x + c`,
      sustit:()=>`f(${fmt(x)}) = ${fmt(t1)} ${t2<0?"−":"+"} ${fmt(Math.abs(t2))} ${c<0?"−":"+"} ${fmt(Math.abs(c))} = <b>${fmt(y)}</b>`,
      tipo:"num", campos:[{id:"y",et:`f(${fmt(x)}) =`,val:y}],
      pista:"Suma los tres valores respetando cada signo.",
      explica:()=>`Queda el punto <b>${par(x,y)}</b>${i===xs.length-1?". Al unir todos los puntos aparece la parábola.":", listo para marcarlo en el plano."}`,
      cuenta:()=>`Punto: <b>${par(x,y)}</b>`,
      revela:{punto:[x,y], curva: i===xs.length-1}});
  });
  return {a,b,c, meta:12, titulo:"Tabla de valores para graficar", encabezado:eqHTML(a,b,c), pasos};
}

/* --- 7. Ceros de la ecuación --- */
function ejCeros(){
  const caso = Math.random()<.6 ? "dos" : (Math.random()<.6 ? "doble" : "ninguna");
  let a,b,c;
  if(caso==="dos"){
    let r1,r2;
    if(Math.random()<.4){
      const d1 = pick([2,3]), d2 = pick([2,3]);
      let n1 = pick([-3,-2,-1,1,2]), n2 = pick([-1,1,2,3,4]);
      while(gcd(Math.abs(n1),d1)!==1) n1++;
      while(gcd(Math.abs(n2),d2)!==1) n2++;
      r1 = n1/d1; r2 = n2/d2;
      if(casi(r1,r2)) r2 = r2+1;
      a = d1*d2*pick([1,-1]);
    } else { r1 = ri(-4,2); r2 = ri(r1+1,4); a = pick([1,-1,2,-2]); }
    if(r1>r2){ const t=r1; r1=r2; r2=t; }
    b = -a*(r1+r2); c = a*r1*r2;
    return armarCeros(a,b,c,b*b-4*a*c,"dos",{r1,r2});
  }
  if(caso==="doble"){
    const mitad = Math.random()<.35, d = mitad?2:1, m = pick([1,2,-1,-2,3]);
    a = m*d*d;
    let n = ri(-3,3); if(n===0) n=1; if(mitad && n%2===0) n = n+1;
    const r = mitad ? n/2 : n;
    b = -2*a*r; c = a*r*r;
    return armarCeros(a,b,c,0,"doble",{r});
  }
  a = pick([1,-1,2,-2]);
  const h = ri(-3,3), k = (a>0?1:-1)*ri(1,5);
  b = -2*a*h; c = a*h*h+k;
  return armarCeros(a,b,c,b*b-4*a*c,"ninguna",{h,k});
}
function armarCeros(a,b,c,D,caso,dat){
  const raizD = D>=0 ? Math.sqrt(D) : null;
  const comunes = [
    {corto:"Identificar a, b y c", titulo:"Paso 1 · Datos de la ecuación",
     dice:"Igualamos la función a cero. Los coeficientes son los mismos de la forma general.",
     formula:"a<i class='v'>x</i>² + b<i class='v'>x</i> + c = 0",
     tipo:"num", campos:[{id:"a",et:"a =",val:a},{id:"b",et:"b =",val:b},{id:"c",et:"c =",val:c}],
     pista:"Copia cada coeficiente con su signo, igual que en la forma general.",
     explica:()=>`a = <b>${fmt(a)}</b>, b = <b>${fmt(b)}</b>, c = <b>${fmt(c)}</b>.`},
    {corto:"Calcular b²", titulo:"Paso 2 · Primero eleva b al cuadrado",
     dice:"El discriminante tiene dos partes. Empieza por la primera: <b>b²</b>.",
     sustit:()=>`b² = (${fmt(b)})² = <b>${fmt(b*b)}</b>`,
     tipo:"num", campos:[{id:"b2",et:"b² =",val:b*b}],
     pista:"Multiplica b por sí mismo. Si b es negativo, el resultado queda positivo.",
     explica:()=>`b² = <b>${fmt(b*b)}</b>.`},
    {corto:"Calcular 4ac", titulo:"Paso 3 · Ahora la segunda parte: 4ac",
     dice:"Multiplica los tres factores en orden: 4, luego a, luego c.",
     sustit:()=>`4ac = 4 · ${neg(a)} · ${neg(c)} = ${fmt(4*a)} · ${neg(c)} = <b>${fmt(4*a*c)}</b>`,
     tipo:"num", campos:[{id:"ac",et:"4ac =",val:4*a*c},],
     pista:"Menos por menos da más. Si a o c es cero, todo el producto es cero.",
     explica:()=>`4ac = <b>${fmt(4*a*c)}</b>.`},
    {corto:"Restar: Δ", titulo:"Paso 4 · Resta para obtener el discriminante",
     dice:"Ya tienes las dos partes. Réstalas.",
     formula:"Δ = b² − 4ac",
     sustit:()=>`Δ = ${fmt(b*b)} − (${fmt(4*a*c)}) = <b>${fmt(D)}</b>`,
     tipo:"num", campos:[{id:"D",et:"Δ =",val:D}],
     pista:"Cuidado: si 4ac es negativo, restarlo equivale a sumarlo.",
     explica:()=>`Δ = <b>${fmt(D)}</b>.`,
     cuenta:()=>`Discriminante: <b>Δ = ${fmt(D)}</b>`},
    {corto:"Interpretar Δ", titulo:"Paso 5 · ¿Cuántas soluciones hay?",
     dice:"Δ &gt; 0 → dos soluciones · Δ = 0 → una · Δ &lt; 0 → ninguna real.",
     tipo:"opcion", opciones:[{v:"2",txt:"Dos soluciones (corta el eje x en 2 puntos)"},{v:"1",txt:"Una sola solución (toca el eje x)"},{v:"0",txt:"Ninguna solución real"}],
     correcta: D>0?"2":D===0?"1":"0",
     pista:"Compara el discriminante que acabas de calcular con cero: ¿es positivo, cero o negativo?",
     explica:()=>`Como Δ = ${fmt(D)} es ${D>0?"positivo":D===0?"cero":"negativo"}, hay <b>${D>0?"dos soluciones":D===0?"una solución":"ninguna solución real"}</b>.`}
  ];

  let finales;
  if(caso==="ninguna"){
    finales = [
      {corto:"Armar el eje de simetría", titulo:"Paso 6 · Compruébalo con el vértice",
       dice:"No hay raíz real de un número negativo, así que no se puede seguir con la fórmula. Comprobemos por qué la curva no toca el eje: arma la fracción del eje de simetría.",
       formula:"h = "+fr("− b","2a"),
       sustit:()=>`h = ${fr("− ("+fmt(b)+")","2 · "+neg(a))} = ${fr(-b,2*a)}`,
       tipo:"frac", campos:[{id:"n",et:"numerador (− b)",val:-b},{id:"d",et:"denominador (2a)",val:2*a}],
       pista:"Arriba el signo de b cambiado, abajo 2 por a.",
       explica:()=>`La fracción queda ${fr(-b,2*a)}.`},
      {corto:"Resolver h", titulo:"Paso 7 · La x del vértice",
       dice:"Resuelve la fracción anterior.",
       sustit:()=>`h = ${fr(-b,2*a)} = <b>${fmt(dat.h)}</b>`,
       tipo:"num", campos:[{id:"h",et:"h =",val:dat.h}],
       pista:"Divide el numerador entre el denominador.",
       explica:()=>`h = <b>${fmt(dat.h)}</b>.`,
       revela:{eje:true}},
      {corto:"Hallar k y concluir", titulo:"Paso 8 · La altura del vértice",
       dice:"Reemplaza esa h en la función. La altura del vértice explica por qué no hay soluciones.",
       formula:`k = f(${fmt(dat.h)})`,
       sustit:()=>`k = ${neg(a)}·(${fmt(dat.h)})² ${b<0?"−":"+"} ${fmt(Math.abs(b))}·(${fmt(dat.h)}) ${c<0?"−":"+"} ${fmt(Math.abs(c))} = <b>${fmt(dat.k)}</b>`,
       tipo:"num", campos:[{id:"k",et:"k =",val:dat.k}],
       pista:"Eleva primero al cuadrado y luego suma cada término con su signo.",
       explica:()=>`El vértice es <b>${par(dat.h,dat.k)}</b>. Como la parábola abre hacia ${a>0?"arriba":"abajo"} y su punto ${a>0?"más bajo":"más alto"} ya está ${a>0?"por encima":"por debajo"} del eje <i class='v'>x</i>, la curva <b>nunca lo cruza</b>: por eso Δ salió negativo.`,
       cuenta:()=>`Vértice: <b>${par(dat.h,dat.k)}</b> · sin cortes con el eje x`,
       revela:{curva:true,vertice:true}}
    ];
  } else {
    const dosRaices = caso==="dos";
    finales = [
      {corto:"Calcular √Δ", titulo:"Paso 6 · La raíz del discriminante",
       dice:"La fórmula general lleva la raíz de Δ. Calcúlala aparte para no equivocarte.",
       formula:raiz("Δ"),
       sustit:()=>`${raiz(fmt(D))} = <b>${fmt(raizD)}</b>`,
       tipo:"num", campos:[{id:"rd",et:"√Δ =",val:raizD}],
       pista: D===0 ? "La raíz cuadrada de 0 es 0." : `Busca el número que multiplicado por sí mismo da ${fmt(D)}.`,
       explica:()=> D===0 ? "√0 = <b>0</b>, por eso el ± desaparece y solo habrá una solución."
                          : `√${fmt(D)} = <b>${fmt(raizD)}</b>.`},
      {corto:"Armar la fórmula", titulo:"Paso 7 · Prepara el numerador y el denominador",
       dice:"Antes de dividir, calcula las dos piezas que faltan de la fórmula general.",
       formula:"x = "+fr("− b ± "+raiz("Δ"),"2a"),
       sustit:()=>`− b = − (${fmt(b)}) = <b>${fmt(-b)}</b> &nbsp;·&nbsp; 2a = 2 · ${neg(a)} = <b>${fmt(2*a)}</b>`,
       tipo:"num", campos:[{id:"nb",et:"− b =",val:-b},{id:"da",et:"2a =",val:2*a}],
       pista:"Cambia el signo de b para el numerador y multiplica 2 por a para el denominador.",
       explica:()=>`Numerador: ${fmt(-b)} ± ${fmt(raizD)} &nbsp;·&nbsp; Denominador: ${fmt(2*a)}.`},
      dosRaices ? {
        corto:"Resolver las dos soluciones", titulo:"Paso 8 · Resuelve el ± y obtén los ceros",
        dice:"Resuelve dos veces: una restando la raíz y otra sumándola. Escribe primero el menor.",
        sustit:()=>`x = ${fr(fmt(-b)+" ± "+fmt(raizD),fmt(2*a))}<br>x = ${fr(fmt(-b)+" − "+fmt(raizD),fmt(2*a))} = ${fr(-b-raizD,2*a)} = <b>${N(dat.r1)}</b><br>x = ${fr(fmt(-b)+" + "+fmt(raizD),fmt(2*a))} = ${fr(-b+raizD,2*a)} = <b>${N(dat.r2)}</b>`,
        tipo:"num", campos:[{id:"x1",et:"x₁ (menor)",val:dat.r1},{id:"x2",et:"x₂ (mayor)",val:dat.r2}],
        pista:`Haz las dos cuentas: (${fmt(-b)} − ${fmt(raizD)}) ÷ ${fmt(2*a)} y (${fmt(-b)} + ${fmt(raizD)}) ÷ ${fmt(2*a)}. Si no da entero, deja la fracción simplificada.`,
        explica:()=>`Los ceros son <b>${N(dat.r1)}</b> y <b>${N(dat.r2)}</b>: los puntos donde la gráfica corta el eje <i class='v'>x</i>.`,
        cuenta:()=>`Ceros: <b>${N(dat.r1)}</b> y <b>${N(dat.r2)}</b>`,
        revela:{curva:true,raices:true}
      } : {
        corto:"Resolver la solución doble", titulo:"Paso 8 · Una sola solución",
        dice:"Como √Δ = 0, el ± no cambia nada: solo queda −b dividido entre 2a.",
        sustit:()=>`x = ${fr(fmt(-b)+" ± 0",fmt(2*a))} = ${fr(-b,2*a)} = <b>${N(dat.r)}</b>`,
        tipo:"num", campos:[{id:"x",et:"x =",val:dat.r}],
        pista:"Divide el numerador entre el denominador que calculaste en el paso anterior.",
        explica:()=>`La única solución es <b>x = ${N(dat.r)}</b>. Ahí la parábola <b>toca</b> el eje <i class='v'>x</i> sin cruzarlo, y ese punto es también el vértice.`,
        cuenta:()=>`Solución doble: <b>x = ${N(dat.r)}</b>`,
        revela:{curva:true,raices:true,vertice:true}
      }
    ];
  }
  return {a,b,c, meta:16, titulo:"Ceros de la ecuación y cortes con el eje x",
    encabezado: eqHTML(a,b,c,"")+" = 0",
    pasos: comunes.concat(finales)};
}

      html:`<div class="formula">f(<i class='v'>x</i>) = a(<i class='v'>x</i> − h)² + k</div>
        <p>Escrita así, el <b>vértice se lee directo</b>: es (h, k). Cuidado con el signo dentro del paréntesis:</p>
        <ul><li>(x − 4)² → h = <b>4</b></li><li>(x + 4)² → h = <b>−4</b></li></ul>`},
     {et:"Micro repaso 2 de 2", h:"Foco, directriz y la distancia p",
      html:`<p>Toda parábola tiene un punto llamado <b>foco</b> y una recta llamada <b>directriz</b>. Cada punto de la curva está a la <b>misma distancia</b> de los dos.</p>
        <div class="formula">p = ${fr(1,"4a")} · F = (h, k + p) · directriz: y = k − p</div>
        <p>El foco siempre queda <b>dentro</b> de la curva y la directriz por fuera. Por eso las antenas satelitales y los faros de los carros son parabólicos: todo se concentra en el foco.</p>`, graf:{a:0.5,b:0,c:-1,curva:true,vertice:true,foco:true,directriz:true}}
   ]},

  {id:"tabla", emoji:"📈", color:"c-verde", titulo:"Tabla de valores", desc:"Calcula puntos y arma la gráfica.",
   gen:ejTabla,
   teoria:[
     {et:"Micro repaso 1 de 2", h:"Graficar punto por punto",
      html:`<p>Para dibujar una parábola sin fórmulas complicadas:</p>
        <ul><li>Elige valores de <i class='v'>x</i> (por ejemplo −2, −1, 0, 1, 2).</li>
        <li>Reemplaza cada uno en la función y obtén su <i class='v'>y</i>.</li>
        <li>Marca los pares (<i class='v'>x</i>, <i class='v'>y</i>) y únelos con una curva suave.</li></ul>`, graf:{a:1,b:0,c:-3,curva:true,puntos:[[-2,1],[-1,-2],[0,-3],[1,-2],[2,1]]}},
     {et:"Micro repaso 2 de 2", h:"El error más común",
      html:`<p>El cuadrado de un número negativo da <b>positivo</b>:</p>
        <div class="formula">(−3)² = 9 &nbsp;&nbsp; pero &nbsp;&nbsp; −3² = −9</div>
        <p>Por eso siempre se escribe el número entre paréntesis al reemplazar.</p>
        <div class="ejemplo">f(x) = 2x² − x + 1 con x = −2 → f(−2) = 2·(−2)² − (−2) + 1 = 8 + 2 + 1 = <b>11</b>.</div>`}
   ]},

  {id:"ceros", emoji:"🎯", color:"c-verde", titulo:"Ceros de la ecuación", desc:"Discriminante y fórmula general, término por término.",
   gen:ejCeros, meta:16,
   teoria:[
     {et:"Micro repaso 1 de 3", h:"De la función a la ecuación",
      html:`<p>Si a la función le pedimos que valga cero, obtenemos la <b>ecuación cuadrática</b>:</p>
        <div class="formula">a<i class='v'>x</i>² + b<i class='v'>x</i> + c = 0</div>
        <p>Sus soluciones se llaman <b>ceros o raíces</b>, y son justo los puntos donde la gráfica <b>corta el eje x</b>.</p>
        <div class="ejemplo">En <b>6x² − x − 2 = 0</b> las soluciones son ${fr(-1,2)} y ${fr(2,3)}, y la gráfica corta el eje x en (${fr(-1,2)}, 0) y (${fr(2,3)}, 0).</div>`, graf:{a:6,b:-1,c:-2,curva:true,raices:true}},
     {et:"Micro repaso 2 de 3", h:"El discriminante avisa",
      html:`<div class="formula">Δ = b² − 4ac</div>
        <ul><li>Δ &gt; 0 → la parábola <b>corta</b> el eje x en dos puntos: dos soluciones.</li>
        <li>Δ = 0 → la parábola <b>toca</b> el eje x: una sola solución.</li>
        <li>Δ &lt; 0 → <b>no toca</b> el eje x: no hay soluciones reales.</li></ul>`, graf:{a:1,b:0,c:2,curva:true}},
     {et:"Micro repaso 3 de 3", h:"Fórmula general",
      html:`<div class="formula">x = ${fr("− b ± "+raiz("b² − 4ac"),"2a")}</div>
        <p>El símbolo ± significa que hay que resolver <b>dos veces</b>: una sumando la raíz y otra restándola.</p>
        <div class="ejemplo">Si el resultado no es entero, se deja como fracción simplificada. Es totalmente válido responder ${fr(2,3)}.</div>`}
   ]}
];

const ANIMOS = ["¡Excelente!","¡Sigue así!","Cada vez lo haces mejor.","¡Buen trabajo!","Ya casi completas la lección.","Vas entendiendo el procedimiento."];

function tarjeta(l,lab,n){
  const p = S.prog[l.id]||0;

  const est = l.gen ? (p>=m?`<span class="pill hecho">✔ Lista</span>`:p>0?`<span class="pill curso">${p}/${m}</span>`:`<span class="pill">Repaso + ${m}</span>`)
                    : `<span class="pill">Libre</span>`;
  return `<button class="card ${lab?"lab":""}" data-lec="${l.id}">
    <div class="ico ${l.color||""}">${l.emoji}${n?`<span class="nlec">${n}</span>`:""}</div>

function abrir(id){
  const l = LECCIONES.find(x=>x.id===id);

  S.lecc = l; verTeoria(0);
}

/* ===================== TEORÍA ===================== */

/* ===================== PRÁCTICA PASO A PASO ===================== */
function iniciarPractica(){ nuevoEjercicio(true); }
function nuevoEjercicio(primero){
  const l = S.lecc, viva = !!l.graficaViva;
  S.ej = l.gen(); S.paso = 0; S.resp = {}; S.log = [];
  S.graf = Object.assign({a:S.ej.a,b:S.ej.b,c:S.ej.c,curva:false,eje:false,vertice:false,foco:false,directriz:false,
    raices:false,cortey:false,puntos:[],boceto:false,forma:null,ejeQ:false,verticeQ:false,sinNumerosY:false}, S.ej.grafInicial||{});
  $("#vista").innerHTML = `<div class="vista">

      <div><h2>${l.titulo}</h2><small>Sección ${numLec(l)} · ${S.ej.titulo}</small></div></div>
    <div class="panel camino" id="camino"></div>
    <div class="panel" style="padding:14px">
      <div class="eq chico">${S.ej.encabezado}</div>

    </div>
    <div class="dos-col${viva?"":" sin-graf"}">
      ${viva?`<div class="panel zgraf" style="padding:12px">
        <div class="lienzo" id="lz"></div>
        <div class="leyenda" id="leyenda">
          <span data-k="curva"><i class="punto-l" style="background:#5B3DF5"></i>curva</span>
          <span data-k="eje"><i class="punto-l" style="background:#12B4D8"></i>eje</span>
          <span data-k="vertice"><i class="punto-l" style="background:#F0436A"></i>vértice</span>
          <span data-k="foco"><i class="punto-l" style="background:#FFB020"></i>foco</span>
          <span data-k="raices"><i class="punto-l" style="background:#0FA968"></i>ceros</span>
        </div>
      </div>`:""}
      <div id="zonaPaso"></div>
      <div class="bitacora" id="bitacora"></div>
    </div>
    <div class="dosbtn"><button class="btn gris" id="repasar">📘 Repasar teoría</button><button class="btn gris" id="menu">← Menú</button></div>
  </div>`;
  S.cv = $("#lz") ? montarGrafica($("#lz"), S.graf) : null;
  $("#repasar").addEventListener("click",()=>verTeoria(0));
  $("#menu").addEventListener("click",irMenu);
  pintarCamino(); pintarRuta(); pintarBitacora(); pintarPaso();
  if(primero) window.scrollTo({top:0});
}
function pintarCamino(){
  if(!$("#camino")) return;
  const p = S.prog[S.lecc.id]||0, meta = metaDe(S.lecc), porEj = S.ej?S.ej.pasos.length:4;
  $("#camino").innerHTML = `<div class="cabecera"><span>Tu recorrido en esta lección</span><span><b>${p}</b> / ${meta} pasos</span></div>`+caminoSVG(p,meta,porEj);
}
function caminoSVG(p,meta,porEj){
  const N0 = meta||META, W = 340, H = 82, pts = [];
  for(let i=0;i<N0;i++){ const t=i/(N0-1), u=(t-.5)*2; pts.push([16+t*(W-32), 20+40*(1-u*u)]); }
  const linea = pts.map(q=>q.join(",")).join(" ");
  const hechos = pts.slice(0,Math.max(1,p)).map(q=>q.join(",")).join(" ");
  let circ = "";
  pts.forEach((q,i)=>{
    const meta = (i+1)%(porEj||4)===0, on = i<p, r = meta?10:6.5;
    circ += `<circle cx="${q[0]}" cy="${q[1]}" r="${r}" fill="${on?(meta?"#FFB020":"#5B3DF5"):"#E4E0F5"}" stroke="#fff" stroke-width="3"/>`;
    if(meta) circ += `<text x="${q[0]}" y="${q[1]+4}" text-anchor="middle" font-size="10" font-weight="800" fill="${on?"#fff":"#B9B2E0"}">${i+1}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" aria-label="Progreso ${p} de ${N0}">
    <polyline points="${linea}" fill="none" stroke="#E4E0F5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    ${p>0?`<polyline points="${hechos}" fill="none" stroke="#5B3DF5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`:""}
    ${circ}</svg>`;
}
function pintarRuta(){
  if(!$("#ruta")) return;
  const hechos = S.bloq ? S.paso+1 : S.paso;
  $("#ruta").innerHTML = S.ej.pasos.map((p,i)=>{
    const cl = i<hechos?"hecho":i===S.paso?"activo":"";
    return `<li class="${cl}"><span class="n">${i<hechos?"✓":i+1}</span><span>${p.corto}</span></li>`;
  }).join("");
}
function pintarBitacora(){
  if(!$("#bitacora")) return;
  $("#bitacora").classList.toggle("vacia", S.log.length===0);
  $("#bitacora").innerHTML = (S.log.length?`<div class="bit-tit">📝 Procedimiento resuelto hasta ahora</div>`:"") + S.log.map(e=>`<div class="bit">
    <div class="tt">✔ ${e.titulo}</div>${e.texto}
    ${e.cuenta?`<div class="cuenta">${e.cuenta}</div>`:""}</div>`).join("");
}
function pintarPaso(){
  if(!$("#zonaPaso") || !S.ej) return;
  S.bloq = false;
  const p = S.ej.pasos[S.paso];
  let cuerpo = "";
  if(p.tipo==="num"){
    cuerpo = `<div class="grupo-num">`+p.campos.map(c=>`
      <div class="casilla"><span>${c.et}</span><div class="entrada">
        <input id="in_${c.id}" data-id="${c.id}" type="text" inputmode="text" autocomplete="off" placeholder="?">
        <button class="signo" data-for="${c.id}" aria-label="Cambiar el signo" title="Cambiar el signo">±</button>
      </div></div>`).join("")+`</div>`;
  } else if(p.tipo==="frac"){
    const [n,d,r] = p.campos;
    cuerpo = `<div class="fracbox">
        <div class="lbl">${n.et}</div>
        <div class="entrada"><input id="in_${n.id}" data-id="${n.id}" type="text" inputmode="text" autocomplete="off" placeholder="?">
          <button class="signo" data-for="${n.id}" aria-label="Cambiar el signo" title="Cambiar el signo">±</button></div>
        <div class="barra"></div>
        <div class="entrada"><input id="in_${d.id}" data-id="${d.id}" type="text" inputmode="text" autocomplete="off" placeholder="?">
          <button class="signo" data-for="${d.id}" aria-label="Cambiar el signo" title="Cambiar el signo">±</button></div>
        <div class="lbl" style="margin-top:6px">${d.et}</div>
      </div>` + (r ? `
      <div class="grupo-num"><div class="casilla" style="flex:1 1 100%"><span>${r.et}</span><div class="entrada">
        <input id="in_${r.id}" data-id="${r.id}" type="text" inputmode="text" autocomplete="off" placeholder="resultado">
        <button class="signo" data-for="${r.id}" aria-label="Cambiar el signo" title="Cambiar el signo">±</button>
      </div></div></div>` : "");
  } else {
    cuerpo = `<div class="opciones">`+p.opciones.map(o=>`<button class="opcion" data-v="${o.v}" aria-pressed="false">${o.txt}</button>`).join("")+`</div>`;
  }
  $("#zonaPaso").innerHTML = `<div class="panel paso" style="position:relative">
    <div class="paso-cab"><span class="nn">PASO ${S.paso+1} DE ${S.ej.pasos.length}</span></div>
    <h3>${p.titulo.replace(/^Paso \d+ · /,"")}</h3>
    <p class="dice">${p.dice}</p>
    ${p.formula?`<div class="formula">${p.formula}</div>`:""}
    ${cuerpo}
    <p class="tip">${p.tipo==="opcion" ? "Elige una opción y pulsa Comprobar"
      : p.tipo==="frac" && p.campos.length===2 ? "Escribe arriba el numerador y abajo el denominador, con su signo"
      : "Puedes escribir fracciones como 3/4 o decimales como 0,75"}</p>
    <div class="acciones">
      <button class="btn gris" id="btnBorrar">🗑 Borrar</button>
      <button class="btn verde" id="btnComprobar">✅ Comprobar</button>
    </div></div>`;
  $("#zonaPaso").querySelectorAll("input").forEach(i=>{
    i.addEventListener("focus",()=>i.select());
    i.addEventListener("input",()=>{ i.classList.remove("malo"); S.resp[i.dataset.id]=i.value; });
    i.addEventListener("keydown",e=>{ if(e.key==="Enter") $("#btnComprobar").click(); });
  });
  $("#zonaPaso").querySelectorAll(".signo").forEach(b=>b.addEventListener("click",()=>{
    const i = document.getElementById("in_"+b.dataset.for), v = i.value.trim();
    i.value = (v.startsWith("-")||v.startsWith("−")) ? v.slice(1) : (v===""?"−":"−"+v);
    i.classList.remove("malo"); S.resp[b.dataset.for]=i.value; i.focus();
  }));
  $("#zonaPaso").querySelectorAll(".opcion").forEach(b=>b.addEventListener("click",()=>{
    $("#zonaPaso").querySelectorAll(".opcion").forEach(o=>{o.setAttribute("aria-pressed","false");o.classList.remove("malo");});
    b.setAttribute("aria-pressed","true"); S.resp.op = b.dataset.v;
  }));
  $("#btnBorrar").addEventListener("click",borrar);
  $("#btnComprobar").addEventListener("click",comprobar);
  pintarRuta(); actualizarLeyenda();
}
function actualizarLeyenda(){
  const l = $("#leyenda"); if(!l) return;
  l.querySelectorAll("span").forEach(s=>s.classList.toggle("on", !!S.graf[s.dataset.k] || (s.dataset.k==="vertice" && S.graf.vertice)));
}
function borrar(){
  S.resp = {};
  $("#zonaPaso").querySelectorAll("input").forEach(i=>{i.value="";i.classList.remove("malo","bueno");});
  $("#zonaPaso").querySelectorAll(".opcion").forEach(o=>{o.setAttribute("aria-pressed","false");o.classList.remove("malo");});
  aviso("Casillas limpias ✨");
}
function comprobar(){
  if(S.bloq) return;
  const p = S.ej.pasos[S.paso];
  const malos = {}; let vacio = false, ok = true;
  if(p.tipo==="opcion"){
    if(!S.resp.op) vacio = true;
    else if(S.resp.op !== p.correcta){ ok=false; malos.op=true; }
  } else {
    p.campos.forEach(c=>{
      const v = parseNum(S.resp[c.id]);
      if(isNaN(v)) vacio = true;
      else if(!casi(v,c.val)){ ok=false; malos[c.id]=true; }
    });
  }
  if(vacio){ aviso("Completa la respuesta antes de comprobar"); return; }
  if(!ok){
    S.mal++; S.racha=0; marcador("mal");
    Object.keys(malos).forEach(k=>{
      const i = document.getElementById("in_"+k); if(i){ i.classList.add("malo"); i.classList.remove("bueno"); }
      const o = $("#zonaPaso").querySelector('.opcion[aria-pressed="true"]'); if(k==="op"&&o) o.classList.add("malo");
    });
    S.bloq = false;
    modalError(p);
    return;
  }
  /* ---- correcto ---- */
  S.bloq = true;
  const bc = $("#btnComprobar"); if(bc){ bc.disabled = true; bc.textContent = "✔ Correcto"; }
  S.ok++; S.racha++; marcador("ok");
  S.prog[S.lecc.id] = Math.min(metaDe(S.lecc),(S.prog[S.lecc.id]||0)+1);
  $("#zonaPaso").querySelectorAll("input").forEach(i=>i.classList.add("bueno"));

  S.log.push({titulo:p.corto, texto:(p.sustit?`<div class="cuenta">${p.sustit()}</div>`:"")+`<div style="margin-top:6px">${p.explica()}</div>`,
    cuenta:p.cuenta?p.cuenta():null, datos:datosDelPaso(p)});
  if(p.revela){
    const r = Object.assign({},p.revela);
    if(r.punto){ S.graf.puntos.push(r.punto); delete r.punto; }
    Object.assign(S.graf,r); if(S.cv && S.cv.isConnected) redibujar(S.cv);
  }
  pintarBitacora(); actualizarLeyenda(); pintarCamino();

  mostrarAcierto(p);
}

/* datos concretos que dejó resueltos un paso */
function datosDelPaso(p){
  if(p.tipo==="opcion"){
    const o = p.opciones.find(x=>x.v===p.correcta);
    return o ? [o.txt.replace(/^[^\wÁÉÍÓÚÑa-z]+/,"").trim()] : [];
  }
  return p.campos.map(c=>{
    const et = /=\s*$/.test(c.et) ? c.et : c.et+" =";
    return `${et} <b>${N(c.val)}</b>`;
  });
}

/* pantalla de repaso tras acertar: gráfica + datos + botón siguiente */
function mostrarAcierto(p){
  if(!$("#zonaPaso")) return;
  const meta = metaDe(S.lecc), prog = S.prog[S.lecc.id]||0;
  const ultimoPaso = S.paso+1 >= S.ej.pasos.length;
  const fin = prog >= meta;
  const logro = !fin && ultimoPaso;
  const datos = S.log.flatMap(e=>e.datos||[]);
  const verGraf = !!S.lecc.graficaViva || ultimoPaso;
  const titulo = fin ? "🎉 ¡Lección completada!" : logro ? "🏅 ¡Ejercicio resuelto!" : pick(ELOGIOS);
  const sub = fin ? "Terminaste todos los pasos de esta lección."
            : logro ? `Completaste el procedimiento entero. Llevas ${prog} de ${meta} pasos.`
            : "Revisa cómo va quedando la gráfica antes de continuar.";
  const boton = fin ? "Ver mis resultados 🎉" : logro ? "Siguiente ejercicio →" : "Siguiente paso →";

  $("#zonaPaso").innerHTML = `<div class="panel paso acierto">
    <div class="sello ok">✔</div>
    <h3>${titulo}</h3>
    <p class="dice" style="text-align:center;color:var(--gris);font-weight:600">${sub}</p>
    ${p.sustit?`<div class="cuenta-ok">${p.sustit()}</div>`:""}
    <p class="expl-ok">${p.explica()}</p>
    ${verGraf?`<div class="rev-graf">
      <div class="rev-tit">📈 ${S.lecc.graficaViva?"Así va la gráfica":"Gráfica resultante"}</div>
      <div class="lienzo" id="lzOk"></div>
    </div>`:""}
    ${datos.length?`<div class="rev-datos"><div class="rev-tit">📋 Datos encontrados</div>
      <ul>${datos.map(d=>`<li>${d}</li>`).join("")}</ul></div>`:""}
    ${(logro||fin)?`<button class="btn ambar" id="btnCuaderno">📓 Pasar este ejercicio al cuaderno</button>`:""}
    <button class="btn verde" id="btnSiguiente">${boton}</button>
  </div>`;
  if($("#lzOk")) montarGrafica($("#lzOk"), Object.assign({},S.graf,{puntos:(S.graf.puntos||[]).slice()}));
  if(logro||fin) confeti(fin?60:24);
  pintarRuta();
  $("#btnSiguiente").addEventListener("click",()=>{
    if(fin) return pantallaLogro();
    if(ultimoPaso) return nuevoEjercicio();
    S.paso++; S.resp = {}; pintarPaso();
    if(S.racha%3===0) aviso(pick(ANIMOS));
  });
  const bc = $("#btnCuaderno"); if(bc) bc.addEventListener("click",hojaCuaderno);
  $("#btnSiguiente").focus({preventScroll:true});
}

/* ============ HOJA PARA COPIAR AL CUADERNO ============ */
function aTexto(html){
  return String(html)
    .replace(/<span class="fr"><b>(.*?)<\/b><u>(.*?)<\/u><\/span>/g,"($1)/($2)")
    .replace(/<span class="rad"><em>√<\/em><u>(.*?)<\/u><\/span>/g,"√($1)")
    .replace(/<br\s*\/?>/g,"\n")
    .replace(/<\/(div|p|li)>/g,"\n")
    .replace(/<[^>]+>/g,"")
    .replace(/&nbsp;/g," ").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&")
    .replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
}
function hojaCuaderno(){
  const ej = S.ej, l = S.lecc;
  const pasos = S.log.map((e,i)=>`<li><b>${e.titulo}</b>${e.texto}</li>`).join("");
  const datos = S.log.flatMap(e=>e.datos||[]);
  const resultados = S.log.map(e=>e.cuenta).filter(Boolean);
  abrirModal(`<div class="modal hoja" id="hoja">
    <div class="hoja-cab">
      <div><h3>📓 Para pasar al cuaderno</h3>
        <p class="hoja-meta">${escapa(S.nombre)} · ${escapa(S.grado)} · Sección ${numLec(l)}: ${escapa(l.titulo)}</p></div>
    </div>
    <div class="hoja-cuerpo" id="hojaCuerpo">
      <div class="hoja-enun"><span class="hoja-et">Ejercicio</span>${ej.encabezado}</div>
      <span class="hoja-et">Procedimiento</span>
      <ol class="hoja-pasos">${pasos}</ol>
      ${resultados.length?`<span class="hoja-et">Resultados</span><div class="hoja-res">${resultados.join("<br>")}</div>`:""}
      ${datos.length?`<span class="hoja-et">Datos</span><div class="hoja-res">${datos.join(" &nbsp;·&nbsp; ")}</div>`:""}
      <span class="hoja-et">Gráfica</span>
      <div class="lienzo" id="lzHoja"></div>
    </div>
    <div class="hoja-btns">
      <button class="btn gris" id="hImp">🖨 Imprimir</button>
      <button class="btn gris" id="hCop">📋 Copiar</button>
      <button class="btn verde" id="hCer">Listo, ya lo copié</button>
    </div>
  </div>`);
  montarGrafica($("#lzHoja"), Object.assign({},S.graf,{boceto:false,verticeQ:false,sinNumerosY:false,curva:true,puntos:(S.graf.puntos||[]).slice()}));
  $("#hImp").addEventListener("click",()=>window.print());
  $("#hCop").addEventListener("click",async()=>{
    const txt = `${S.nombre} · ${S.grado}\nSección ${numLec(l)}: ${l.titulo}\n\nEjercicio: ${aTexto(ej.encabezado)}\n\n`
      + S.log.map((e,i)=>`${i+1}) ${e.titulo}\n${aTexto(e.texto)}`).join("\n\n")
      + (resultados.length?`\n\nResultados:\n${resultados.map(r=>"• "+aTexto(r)).join("\n")}`:"");
    try{ await navigator.clipboard.writeText(txt); aviso("Procedimiento copiado ✅"); }
    catch(e){
      const ta = document.createElement("textarea");
      ta.value = txt; ta.className="hoja-ta"; ta.readOnly = true;
      $("#hojaCuerpo").prepend(ta); ta.focus(); ta.select();
      aviso("Selecciona el texto y cópialo");
    }
  });
  $("#hCer").addEventListener("click",cerrarCapa);
}
function modalError(p){
  abrirModal(`<div class="modal">
    <div class="sello mal">✖</div>
    <h3>Inténtalo nuevamente</h3>
    <p>Revisa este paso, no pierdes la oportunidad.</p>
    <div class="porque">💡 ${p.pista}</div>
    <p style="margin-top:10px;font-size:.88rem">Vuelves al mismo paso para corregir. Equivocarse también es aprender.</p>
    <button class="btn" id="mR">Volver al paso ${S.paso+1}</button></div>`);
  $("#mR").addEventListener("click",()=>{
    cerrarCapa();
    const i = $("#zonaPaso").querySelector("input.malo"); if(i){ i.focus(); i.select(); }
  });
}
function pantallaLogro(){
  const tot = S.ok+S.mal, pct = tot?Math.round(S.ok/tot*100):0;
  const lecs = LECCIONES.filter(l=>l.gen);
  const idx = lecs.findIndex(l=>l.id===S.lecc.id);
  const sig = lecs.slice(idx+1).find(l=>S.prog[l.id]<metaDe(l)) || lecs.find(l=>S.prog[l.id]<metaDe(l));
  confeti(60);
  abrirModal(`<div class="modal">
    <div class="sello fiesta">🎉</div>
    <h3>¡Lección completada!</h3>
    <p>${escapa(S.lecc.titulo)}</p>
    <div class="resumen">
      <div><small>Estudiante</small><b>${escapa(S.nombre)}</b></div>
      <div><small>Grado</small><b>${escapa(S.grado)}</b></div>
      <div><small>Tiempo</small><b>${tiempoTxt()}</b></div>
      <div><small>Porcentaje</small><b>${pct}%</b></div>
      <div><small>Aciertos</small><b style="color:#0FA968">✔ ${S.ok}</b></div>
      <div><small>Errores</small><b style="color:#F0436A">✖ ${S.mal}</b></div>
    </div>
    <p style="margin-top:12px;font-weight:700;color:#1B1544">Excelente trabajo. Ya sabes hacer el procedimiento completo, no solo la respuesta final.</p>
    <button class="btn verde" id="mS">${sig?"Siguiente lección: "+sig.titulo+" →":"Volver al menú"}</button>
    <button class="btn gris" id="mM">Ir al menú principal</button></div>`);
  $("#mS").addEventListener("click",()=>{ cerrarCapa(); if(sig){ S.lecc=sig; verTeoria(0); } else irMenu(); });
  $("#mM").addEventListener("click",()=>{ cerrarCapa(); irMenu(); });
}

/* ===================== LABORATORIO ===================== */
function verLab(){
  $("#vista").innerHTML = `<div class="vista">
    <div class="cab-lec"><div class="ico c-cian">🔬</div><div><h2>Laboratorio de parábolas</h2><small>Mueve los controles y observa</small></div></div>
    <div class="dos-col">
      <div class="panel pegado" style="padding:12px">
        <div class="lienzo" id="lzLab"></div>
        <div class="leyenda">
          <span class="on"><i class="punto-l" style="background:#5B3DF5"></i>curva</span>
          <span class="on"><i class="punto-l" style="background:#F0436A"></i>vértice</span>
          <span class="on"><i class="punto-l" style="background:#12B4D8"></i>eje</span>
          <span class="on"><i class="punto-l" style="background:#FFB020"></i>foco</span>
          <span class="on"><i class="punto-l" style="background:#0FA968"></i>ceros</span>
        </div>
      </div>
      <div>
        <div class="panel">
          <div class="eq chico" id="labEq"></div>
          <div class="slider-fila"><label for="sa"><em>a</em> abertura</label><input type="range" id="sa" min="-3" max="3" step="0.25" value="1"><output id="oa">1</output></div>
          <div class="slider-fila"><label for="sb"><em>b</em> corrimiento</label><input type="range" id="sb" min="-8" max="8" step="0.5" value="0"><output id="ob">0</output></div>
          <div class="slider-fila"><label for="sc"><em>c</em> corte en y</label><input type="range" id="sc" min="-8" max="8" step="0.5" value="-2"><output id="oc">−2</output></div>
          <div class="toggles">
            <button class="tg" data-tg="eje" aria-pressed="true">🪞 Eje</button>
            <button class="tg" data-tg="vertice" aria-pressed="true">📍 Vértice</button>
            <button class="tg" data-tg="foco" aria-pressed="false">🔦 Foco</button>
            <button class="tg" data-tg="directriz" aria-pressed="false">📏 Directriz</button>
            <button class="tg" data-tg="raices" aria-pressed="true">🎯 Ceros</button>
          </div>
          <div class="preset">
            <button data-p="6,-1,-2">Ejemplo del libro: 6x² − x − 2</button>
            <button data-p="-1,0,4">Abre hacia abajo</button>
            <button data-p="1,-4,4">Un solo cero</button>
            <button data-p="1,0,3">Sin ceros reales</button>
          </div>
        </div>
        <div class="panel"><div class="datos" id="labDatos"></div>
          <p style="margin:12px 0 0;font-weight:700;font-size:.93rem;color:#6C6790" id="labTxt"></p></div>
        <button class="btn gris" id="labVolver">← Volver al menú</button>
      </div>
    </div></div>`;
  const opt = {a:1,b:0,c:-2,curva:true,eje:true,vertice:true,foco:false,directriz:false,raices:true,puntos:[]};
  const cv = montarGrafica($("#lzLab"),opt);
  const act = ()=>{
    let a = Number($("#sa").value); if(a===0){ a=.25; $("#sa").value=.25; }
    opt.a=a; opt.b=Number($("#sb").value); opt.c=Number($("#sc").value);
    $("#oa").textContent=fmt(opt.a); $("#ob").textContent=fmt(opt.b); $("#oc").textContent=fmt(opt.c);
    $("#labEq").innerHTML = eqHTML(opt.a,opt.b,opt.c);
    const h=-opt.b/(2*opt.a), k=opt.a*h*h+opt.b*h+opt.c, D=opt.b*opt.b-4*opt.a*opt.c, p=1/(4*opt.a);
    const rr = D>0 ? `${N(Math.round((-opt.b-Math.sqrt(D))/(2*opt.a)*1000)/1000)} y ${N(Math.round((-opt.b+Math.sqrt(D))/(2*opt.a)*1000)/1000)}`
            : D===0 ? N(h) : "no tiene reales";
    $("#labDatos").innerHTML = `
      <div class="dato"><small>Abre hacia</small><b>${opt.a>0?"▲ arriba":"▼ abajo"}</b></div>
      <div class="dato"><small>Eje de simetría</small><b>x = ${N(Math.round(h*1000)/1000)}</b></div>
      <div class="dato"><small>Vértice</small><b>${parN(Math.round(h*1000)/1000,Math.round(k*1000)/1000)}</b></div>
      <div class="dato"><small>p = 1/(4a)</small><b>${N(Math.round(p*1000)/1000)}</b></div>
      <div class="dato"><small>Discriminante</small><b>${fmt(Math.round(D*100)/100)}</b></div>
      <div class="dato"><small>Ceros</small><b>${rr}</b></div>`;
    $("#labTxt").innerHTML = D>0?"Δ es positivo: la parábola corta el eje <i class='v'>x</i> en dos puntos, la ecuación tiene <b>dos soluciones</b>."
      : D===0?"Δ es cero: la parábola toca el eje <i class='v'>x</i> en un punto, hay <b>una solución</b>."
      : "Δ es negativo: la parábola no toca el eje <i class='v'>x</i>, <b>no hay soluciones reales</b>.";
    redibujar(cv);
  };
  ["sa","sb","sc"].forEach(id=>$("#"+id).addEventListener("input",act));
  $("#vista").querySelectorAll(".tg").forEach(t=>t.addEventListener("click",()=>{
    const on = t.getAttribute("aria-pressed")==="true";
    t.setAttribute("aria-pressed",String(!on)); opt[t.dataset.tg]=!on; redibujar(cv);
  }));
  $("#vista").querySelectorAll(".preset button").forEach(t=>t.addEventListener("click",()=>{
    const [a,b,c] = t.dataset.p.split(",").map(Number);
    $("#sa").value=Math.max(-3,Math.min(3,a)); $("#sb").value=b; $("#sc").value=c; act();
  }));
  $("#labVolver").addEventListener("click",irMenu);
  act(); window.scrollTo({top:0});
}

/* ===================== AVISOS ===================== */
function cerrarCapa(){ $("#capa").innerHTML=""; }
function abrirModal(html){
  $("#capa").innerHTML = `<div class="capa">${html}</div>`;
  const b = $("#capa").querySelector("button"); if(b) b.focus();
}
function aviso(txt){
  const d = document.createElement("div"); d.className="aviso"; d.textContent=txt;
  document.body.appendChild(d);
  setTimeout(()=>{ d.style.transition="opacity .3s"; d.style.opacity="0"; setTimeout(()=>d.remove(),300); },1500);
}
function confeti(n){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#5B3DF5","#FFB020","#0FA968","#12B4D8","#F0436A"];
  const w = document.createElement("div"); w.className="confeti";
  for(let i=0;i<n;i++){ const s=document.createElement("i");
    s.style.left=Math.random()*100+"vw"; s.style.top="-20px"; s.style.background=pick(cols);
    s.style.animationDuration=(1.6+Math.random()*1.4)+"s"; s.style.animationDelay=(Math.random()*.5)+"s";
    w.appendChild(s); }
  document.body.appendChild(w); setTimeout(()=>w.remove(),3600);
}
</script>
